<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Boletim — Consultoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Montserrat:wght@300;400;700&family=Oswald:wght@500;600;700&display=swap');

  :root{
    --bg: #070B14;
    --surface: #10141F;
    --surface-2: #151B29;
    --line: #222B3E;
    --text: #F5F7FA;
    --text-muted: #B8BEC7;
    --gold: #3EC1F3;
    --gold-dim: #1B5E86;
    --green: #3FB68B;
    --green-dim: rgba(63,182,139,0.14);
    --red: #E0575A;
    --red-dim: rgba(224,87,90,0.14);
    --font-display: 'Montserrat', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1200px;margin:0 auto;padding:24px 18px 60px;}

  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:16px;}
  .brand .mark{font-family:var(--font-display);font-weight:300;font-size:28px;letter-spacing:0.5px;color:var(--gold);}
  .brand .sub{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;}

  .tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab{
    font-family:var(--font-display);font-size:17px;font-weight:300;letter-spacing:0.3px;
    padding:9px 16px;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:16px;}
  .card h3{font-family:var(--font-display);font-size:20px;font-weight:300;margin:0 0 14px;letter-spacing:0.2px;}
  label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;margin-top:12px;text-transform:uppercase;letter-spacing:0.6px;}
  input[type=text],input[type=date],input[type=time],input[type=number],select{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:9px 10px;border-radius:4px;font-family:var(--font-body);font-size:14px;
  }
  input:focus,select:focus{outline:none;border-color:var(--gold-dim);}
  input:disabled{color:var(--gold);opacity:0.9;cursor:not-allowed;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:120px;}

  button{
    font-family:var(--font-body);font-weight:600;font-size:13px;letter-spacing:0.2px;
    border:none;border-radius:4px;padding:9px 16px;cursor:pointer;transition:opacity .15s;
  }
  button:hover{opacity:0.85;}
  .btn-primary{background:var(--gold);color:#052034;}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
  .btn-sm{padding:5px 10px;font-size:11px;}
  .btn-full{width:100%;padding:12px;font-size:14px;}
  .btn-danger-ghost{background:var(--surface-2);color:var(--red);border:1px solid var(--line);}

  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--font-mono);letter-spacing:0.3px;white-space:nowrap;}
  .chip-green{background:var(--green-dim);color:var(--green);}
  .chip-red{background:var(--red-dim);color:var(--red);}
  .chip-pending{background:var(--surface-2);color:var(--text-muted);}
  .chip-void{background:var(--surface-2);color:var(--text-muted);text-decoration:line-through;}

  .ticket{border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px;background:var(--surface);}
  .ticket.ticket-compact{padding:9px 12px;margin-bottom:7px;}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .ticket-compact .ticket-top{gap:6px;}
  .ticket-client{font-size:16px;font-weight:700;color:var(--gold);}
  .ticket-compact .ticket-client{font-size:14.5px;}
  .ticket-meta{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);margin-top:2px;}
  .ticket-compact .ticket-meta{font-size:11px;margin-top:1px;}
  .match-list{margin-top:10px;border-top:1px solid var(--line);}
  .ticket-compact .match-list{margin-top:6px;}
  .match-row{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .ticket-compact .match-row{padding:5px 0;gap:6px;}
  .match-row:last-child{border-bottom:none;}
  .match-desc{font-size:13.5px;}
  .ticket-compact .match-desc{font-size:12px;}
  .match-desc .teams{font-weight:600;}
  .match-desc .meta{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);display:block;margin-top:2px;}
  .ticket-compact .match-desc .meta{font-size:10.5px;margin-top:0;}
  .match-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
  .ticket-compact .match-actions .btn-sm{padding:3px 7px;font-size:10px;}
  .ticket-footer{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:13px;}
  .ticket-compact .ticket-footer{margin-top:6px;padding-top:6px;font-size:12px;}
  .ticket-actions{margin-top:10px;display:flex;gap:6px;}
  .ticket-compact .ticket-actions{margin-top:6px;}

  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:7px 5px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.4px;font-weight:600;}
  td.num{font-family:var(--font-mono);text-align:center;}
  td.left{text-align:left;}
  tr.total td{font-weight:700;border-top:2px solid var(--line);border-bottom:none;}
  .profit-pos{color:var(--green);}
  .profit-neg{color:var(--red);}

  .link-box{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .link-box code{flex:1;background:var(--surface-2);padding:8px 10px;border-radius:4px;font-family:var(--font-mono);font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .empty{color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center;}
  .week-select{background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:4px;font-family:var(--font-mono);font-size:12px;width:auto;}

  .autocomplete-wrap{position:relative;}
  .autocomplete-list{
    position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--surface-2);
    border:1px solid var(--line);border-radius:4px;max-height:190px;overflow-y:auto;z-index:20;display:none;
  }
  .autocomplete-item{padding:9px 10px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line);}
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item:hover, .autocomplete-item.autocomplete-active{background:var(--surface);color:var(--gold);}

  .draft-card{background:var(--surface-2);border:1px dashed var(--line);}
  .draft-match{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;gap:8px;}
  .draft-match:last-child{border-bottom:none;}
  .odd-total{font-family:var(--font-mono);color:var(--gold);font-size:14px;}

  .client-header{margin-bottom:20px;text-align:center;}
  .client-header .name{font-family:'Montserrat', sans-serif;font-size:clamp(26px,7.5vw,32px);font-weight:500;letter-spacing:0.2px;color:var(--gold);line-height:1.15;}
  .client-header .balance-now{font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-top:4px;}

  .client-page-wrap{margin:-24px -18px -60px;padding:24px 18px 60px;min-height:100vh;}
  @media (max-width:600px){
    .tab{font-size:15px;padding:8px 10px;}
    th,td{font-size:12px;padding:7px 5px;}
    #app{padding:16px 12px 50px;}
    .card{padding:14px;}
    .card h3{font-size:18px;}
    .row{gap:14px;}
    .client-page-wrap{margin:-16px -12px -50px;padding:16px 12px 50px;}
  }
</style>
</head>
<body>
<div id="app"><div class="empty">Carregando…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ======= CONFIGURAÇÃO DO SUPABASE =======
// Pegue esses dois valores em: Supabase > seu projeto > Settings > API
const SUPABASE_URL = 'https://tymcwpyypvzjdzumlfkp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Tf4F0bAvZsHyevsy0JUa0g_q8G4_-dW';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// ==========================================

let STATE = { clients: [], tickets: [], settlements: [], withdrawals: [], transactions: [], commissioners: [], commissionerClients: [], clientWeekDiscounts: [], clientWeekCommissioners: [], clientDiscountHistory: [] };
let ADMIN_TAB = 'dashboard';
let ADMIN_SUBVIEW = 'list'; // 'list' | 'wizard'
let DASH_WEEK = null;
let FINANCE_WEEK = null;
let SHOW_LANCAMENTOS = false;
let SHOW_RETIRADAS = false;
let SHOW_COMISSOES = false;
let SHOW_BAIXAS_HISTORICO = false;
let DRAFT = null;
let EDITING_TICKET_ID = null;
let TEAM_RESULTS = {};
let SEARCH_TIMERS = {};
let SHOW_PENDENTES = false;
let CLIENT_WEEK = null;
let COMMISSIONER_WEEK = null;
let CLIENT_DETAIL_ID = null;
let CLIENT_DETAIL_SUBVIEW = 'info';
let CONFIRM_DELETE_CLIENT = false;
let COMMISSIONER_DETAIL_ID = null;
let CONFIRM_DELETE_COMMISSIONER = false;
let CLIENT_SHOW_PENDENTES = false;
let SESSION = null;

const MARKETS = [
  {v:'Resultado Final', l:'Resultado Final (1X2)'},
  {v:'Resultado Final HT', l:'Resultado Final HT (1º Tempo)'},
  {v:'Dupla Chance', l:'Dupla Chance'},
  {v:'Ambas Marcam', l:'Ambas Marcam'},
  {v:'Total de Gols', l:'Total de Gols (Over/Under)'},
  {v:'Handicap Asiatico', l:'Handicap Asiático'},
  {v:'Handicap Asiatico HT', l:'Handicap Asiático HT (1º Tempo)'},
  {v:'Total de Escanteios', l:'Total de Escanteios'},
  {v:'Total de Escanteios HT', l:'Total de Escanteios HT (1º Tempo)'},
  {v:'Total de Cartoes', l:'Total de Cartões'},
  {v:'Resultado Exato', l:'Resultado Exato'},
  {v:'Outro', l:'—'},
];

async function loadState(){
  try{
    const [{data: clients, error: err1}, {data: tickets, error: err2}, {data: settlements, error: err3}, {data: withdrawals, error: err4}, {data: transactions, error: err5}, {data: commissioners, error: err6}, {data: commissionerClients, error: err7}, {data: weekDiscounts, error: err8}, {data: weekCommissioners, error: err9}, {data: discountHistory, error: err10}] = await Promise.all([
      supabaseClient.from('clients').select('*').order('created_at'),
      supabaseClient.from('tickets').select('*').order('created_at'),
      supabaseClient.from('settlements').select('*').order('paid_at'),
      supabaseClient.from('withdrawals').select('*').order('created_at'),
      supabaseClient.from('transactions').select('*').order('date'),
      supabaseClient.from('commissioners').select('*').order('created_at'),
      supabaseClient.from('commissioner_clients').select('*').order('created_at'),
      supabaseClient.from('client_week_discount').select('*'),
      supabaseClient.from('client_week_commissioners').select('*'),
      supabaseClient.from('client_discount_history').select('*')
    ]);
    if(err1 || err2 || err3 || err4 || err5 || err6 || err7 || err8 || err9 || err10){
      alert('Erro ao conectar no Supabase: '+((err1||err2||err3||err4||err5||err6||err7||err8||err9||err10).message)+'\nVerifique a URL e a ANON KEY no início do arquivo.');
      return;
    }
    STATE.clients = (clients||[]).map(c=>({id:c.id, name:c.name, code:c.code, discount:parseFloat(c.discount)||0, phone:c.phone||'', isDescarga:c.is_descarga||false}));
    STATE.tickets = (tickets||[]).map(t=>({
      id:t.id, clientId:t.client_id, date:t.date, time: t.time ? t.time.slice(0,5) : null,
      stake: parseFloat(t.stake), odds: t.odds!=null ? parseFloat(t.odds) : null, matches: t.matches||[],
      createdAt: t.created_at, ticketNumber: t.ticket_number
    }));
    STATE.settlements = (settlements||[]).map(s=>({
      id:s.id, clientId:s.client_id, weekStart:s.week_start, amount:parseFloat(s.amount), paidAt:s.paid_at
    }));
    STATE.withdrawals = (withdrawals||[]).map(w=>({
      id:w.id, amount:parseFloat(w.amount), description:w.description||'', createdAt:w.created_at
    }));
    STATE.transactions = (transactions||[]).map(t=>({
      id:t.id, type:t.type, category:t.category||'', description:t.description||'', amount:parseFloat(t.amount), date:t.date, createdAt:t.created_at, clientId:t.client_id||null
    }));
    STATE.commissioners = (commissioners||[]).map(c=>({id:c.id, name:c.name, phone:c.phone||'', code:c.code||''}));
    STATE.commissionerClients = (commissionerClients||[]).map(cc=>({
      id:cc.id, commissionerId:cc.commissioner_id, clientId:cc.client_id, percent:parseFloat(cc.percent)||0, effectiveFromWeek:cc.effective_from_week||null
    }));
    STATE.clientWeekDiscounts = (weekDiscounts||[]).map(d=>({
      id:d.id, clientId:d.client_id, weekStart:d.week_start, discountPercent:parseFloat(d.discount_percent)||0
    }));
    STATE.clientWeekCommissioners = (weekCommissioners||[]).map(w=>({
      id:w.id, clientId:w.client_id, weekStart:w.week_start, commissionerId:w.commissioner_id||null, percent:w.percent!=null?parseFloat(w.percent):null
    }));
    STATE.clientDiscountHistory = (discountHistory||[]).map(h=>({
      id:h.id, clientId:h.client_id, discountPercent:parseFloat(h.discount_percent)||0, effectiveFromWeek:h.effective_from_week||null
    }));
  }catch(e){
    alert('Erro ao conectar no Supabase: '+e.message);
  }
}

function uid(){ return Math.random().toString(36).slice(2,9); }
function todaySP(){
  return new Date().toLocaleDateString('en-CA', {timeZone:'America/Sao_Paulo'});
}
function nowTimeSP(){
  return new Date().toLocaleTimeString('en-GB', {timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit'});
}
function handleAutocompleteKeydown(e, listId){
  const box = document.getElementById(listId);
  if(!box || box.style.display==='none' || !box.innerHTML.trim()) return;
  const items = Array.from(box.querySelectorAll('.autocomplete-item'));
  if(items.length===0) return;
  let idx = items.findIndex(it=>it.classList.contains('autocomplete-active'));
  if(e.key==='ArrowDown'){
    e.preventDefault();
    idx = (idx+1) % items.length;
    items.forEach(it=>it.classList.remove('autocomplete-active'));
    items[idx].classList.add('autocomplete-active');
    items[idx].scrollIntoView({block:'nearest'});
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    idx = idx<=0 ? items.length-1 : idx-1;
    items.forEach(it=>it.classList.remove('autocomplete-active'));
    items[idx].classList.add('autocomplete-active');
    items[idx].scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){
    e.preventDefault();
    const active = items[idx>=0?idx:0];
    if(active) active.dispatchEvent(new MouseEvent('mousedown', {bubbles:true}));
  } else if(e.key==='Escape'){
    box.style.display='none';
  }
}
function fmtBRL(v){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v); }
function fmtDate(d){ if(!d) return ''; const [y,m,day]=d.split('-'); return `${day}/${m}`; }

function mondayOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = (day===0?-6:1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function weekLabel(mondayStr){
  const d = new Date(mondayStr+'T00:00:00');
  const sun = new Date(d); sun.setDate(d.getDate()+6);
  const f = x=>x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  return `${f(d)} – ${f(sun)}`;
}

// ---------- TICKET (bilhete) HELPERS ----------
function ticketDate(ticket){
  return ticket.date || todaySP();
}
function ticketResult(ticket){
  if(!ticket.matches.length) return 'pending';
  if(ticket.matches.some(m=>m.result==='red')) return 'red';
  if(ticket.matches.every(m=>m.result==='void')) return 'void';
  if(ticket.matches.some(m=>m.result==='pending')) return 'pending';
  return 'green';
}
function ticketOddTotal(ticket){
  return ticket.matches.filter(m=>m.result!=='void').reduce((p,m)=>p*m.odd,1);
}
function effectiveOdds(ticket){
  return (ticket.odds && ticket.odds>0) ? ticket.odds : ticketOddTotal(ticket);
}
function ticketProfit(ticket){
  const r = ticketResult(ticket);
  let profit;
  if(r==='red') profit = -ticket.stake;
  else if(r==='green'){ const odds = effectiveOdds(ticket); profit = odds ? (ticket.stake*odds) - ticket.stake : 0; }
  else profit = 0;
  const cl = STATE.clients.find(c=>c.id===ticket.clientId);
  if(cl && cl.isDescarga) profit = -profit;
  return profit;
}
function resultChip(r){
  const map = {green:['chip-green','GREEN'], red:['chip-red','RED'], void:['chip-void','ANULADA'], pending:['chip-pending','PENDENTE']};
  const [cls,label] = map[r]||map.pending;
  return `<span class="chip ${cls}">${label}</span>`;
}
function resultIconSmall(r){
  if(r==='green') return '<span style="color:var(--green);font-weight:700">✓</span>';
  if(r==='red') return '<span style="color:var(--red);font-weight:700">✗</span>';
  if(r==='void') return '<span style="color:var(--text-muted);font-weight:700">⊘</span>';
  return '<span style="color:var(--gold);font-weight:700">⏱</span>';
}
function allWeeksSorted(){
  const set = new Set();
  STATE.tickets.forEach(t=>set.add(mondayOf(ticketDate(t))));
  return Array.from(set).sort().reverse();
}

// ---------- ROOT RENDER ----------
function render(){
  const hash = window.location.hash;
  const m = hash.match(/cliente=([a-zA-Z0-9]+)/);
  if(m){ renderClientView(m[1]); return; }
  const mc = hash.match(/comissionado=([a-zA-Z0-9]+)/);
  if(mc){ renderCommissionerView(mc[1]); return; }
  document.title = 'Boletim — Consultoria';
  if(!SESSION){ renderLogin(); return; }
  renderAdmin();
}

// ---------- LOGIN ----------
function renderLogin(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="brand"><span class="mark" style="color:var(--gold)">BET WIN</span><span class="sub">Painel da Consultoria</span></div>
    <div class="card" style="max-width:340px;margin:60px auto 0">
      <h3>Entrar</h3>
      <label>E-mail</label>
      <input type="email" id="login-email" placeholder="seu@email.com" onkeydown="if(event.key==='Enter') document.getElementById('login-password').focus()">
      <label>Senha</label>
      <input type="password" id="login-password" placeholder="Sua senha" onkeydown="if(event.key==='Enter') doLogin()">
      <div id="login-error" style="color:var(--red);font-size:12px;margin-top:8px;display:none"></div>
      <div style="margin-top:14px"><button class="btn-primary btn-full" onclick="doLogin()">Entrar</button></div>
    </div>
  `;
  document.getElementById('login-email').focus();
}
async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display='none';
  if(!email || !password){ errEl.textContent='Preencha e-mail e senha.'; errEl.style.display='block'; return; }
  const {data, error} = await supabaseClient.auth.signInWithPassword({email, password});
  if(error){ errEl.textContent='E-mail ou senha incorretos.'; errEl.style.display='block'; return; }
  SESSION = data.session;
  render();
}
async function doLogout(){
  await supabaseClient.auth.signOut();
  SESSION = null;
  render();
}

// ---------- ADMIN ----------
function renderAdmin(){
  const app = document.getElementById('app');
  const pendentesCount = STATE.tickets.filter(t=>ticketResult(t)==='pending').length;
  app.innerHTML = `
    <div class="brand">
      <div><span class="mark">BET WIN</span></div>
      <button class="btn-ghost btn-sm" onclick="doLogout()">Sair</button>
    </div>
    <div class="tabs">
      <div class="tab ${ADMIN_TAB==='dashboard'?'active':''}" onclick="setTab('dashboard')">Dashboard</div>
      <div class="tab ${ADMIN_TAB==='apostas'?'active':''}" onclick="setTab('apostas')">Apostas</div>
      <div class="tab ${ADMIN_TAB==='pendentes'?'active':''}" onclick="setTab('pendentes')">Pendentes${pendentesCount?' ('+pendentesCount+')':''}</div>
      <div class="tab ${ADMIN_TAB==='clientes'?'active':''}" onclick="setTab('clientes')">Clientes</div>
      <div class="tab ${ADMIN_TAB==='financeiro'?'active':''}" onclick="setTab('financeiro')">Financeiro</div>
      <div class="tab ${ADMIN_TAB==='parceiros'?'active':''}" onclick="setTab('parceiros')">Parceiros</div>
      <div class="tab ${ADMIN_TAB==='config'?'active':''}" onclick="setTab('config')">Configurações</div>
    </div>
    <div id="tab-content"></div>
  `;
  const c = document.getElementById('tab-content');
  if(ADMIN_TAB==='apostas') c.innerHTML = renderApostasTab();
  if(ADMIN_TAB==='pendentes') c.innerHTML = renderPendentesTab();
  if(ADMIN_TAB==='clientes') c.innerHTML = renderClientesTab();

}
function setTab(t){ ADMIN_TAB=t; ADMIN_SUBVIEW='list'; render(); }
function changeDashWeek(dir){
  if(!DASH_WEEK) DASH_WEEK = mondayOf(todaySP());
  DASH_WEEK = shiftWeek(DASH_WEEK, dir*7);
  render();
}
function changeFinanceWeek(dir){
  if(!FINANCE_WEEK) FINANCE_WEEK = mondayOf(todaySP());
  FINANCE_WEEK = shiftWeek(FINANCE_WEEK, dir*7);
  render();
}
function renderPendentesTab(){
  const pendentes = STATE.tickets.filter(t=>ticketResult(t)==='pending').sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">

      </div>
    </div>
    <div class="card">
      ${pendentes.length===0 ? '<div class="empty">Nenhuma aposta pendente no momento.</div>' : pendentes.map(renderTicketCard).join('')}

function renderTicketListItems(list){
  return list.length===0 ? '<div class="empty">Nenhuma aposta encontrada.</div>' : list.map(renderTicketCard).join('');
}
function updateTicketSearch(){
  const val = document.getElementById('ticket-search-input').value.trim().toLowerCase();
  const ticketsSorted = [...STATE.tickets].sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  const filtered = !val ? ticketsSorted : ticketsSorted.filter(t=>{
    const cl = STATE.clients.find(c=>c.id===t.clientId);
    const clientName = cl ? cl.name.toLowerCase() : '';
    const num = String(t.ticketNumber||'');

function ticketDetailsShort(ticket){
  return ticket.matches.map(m=>{
    const marketLabel = MARKETS.find(x=>x.v===m.market)?.l || m.market;
    const teamsLabel = m.away ? `${m.home} x ${m.away}` : m.home;
    return `${teamsLabel} — ${marketLabel}: ${m.selection}`;
  }).join('; ');
}

function renderTicketCard(ticket){
  const cl = STATE.clients.find(c=>c.id===ticket.clientId);
  const r = ticketResult(ticket);
  const profit = ticketProfit(ticket);
  const matchesHtml = ticket.matches.map(m=>{

        </div>

            <button class="btn-ghost btn-sm" onclick="setMatchResult('${ticket.id}','${m.id}','red')">Red</button>
            <button class="btn-ghost btn-sm" onclick="setMatchResult('${ticket.id}','${m.id}','void')">Anular</button>

  return `
    <div class="ticket ticket-compact">
      <div class="ticket-top">

        <span>Resultado</span>

      </div>
      <div class="ticket-actions">
        <button class="btn-ghost btn-sm" onclick="editTicket('${ticket.id}')">Editar</button>
        <button class="btn-ghost btn-sm" onclick="duplicateTicket('${ticket.id}')">Duplicar</button>
        <button class="btn-danger-ghost btn-sm" onclick="deleteTicket('${ticket.id}')">Excluir</button>

async function setMatchResult(ticketId, matchId, result){
  const ticket = STATE.tickets.find(t=>t.id===ticketId);
  const match = ticket.matches.find(m=>m.id===matchId);
  if(!match || match.result!=='pending'){ alert('Esse resultado já foi definido. Para alterar, use Editar aposta.'); render(); return; }
  match.result = result;
  const {error} = await supabaseClient.from('tickets').update({matches: ticket.matches}).eq('id', ticketId);
  if(error){ alert('Erro ao salvar resultado: '+error.message); match.result='pending'; return; }
  render();
}
function setDraftMatchResult(matchId, result){
  const m = DRAFT.matches.find(x=>x.id===matchId);
  if(m){ m.result = result; render(); }
}
async function deleteTicket(ticketId){
  if(!confirm('Excluir esta aposta?')) return;
  const {error} = await supabaseClient.from('tickets').delete().eq('id', ticketId);
  if(error){ alert('Erro ao excluir aposta: '+error.message); return; }
  STATE.tickets = STATE.tickets.filter(t=>t.id!==ticketId);
  render();
}

// ---------- WIZARD (Nova Aposta) ----------
function startNewTicket(){
  DRAFT = {clientId:'', clientName:'', date:todaySP(), time:nowTimeSP(), stake:'', matches:[]};
  EDITING_TICKET_ID = null;
  ADMIN_SUBVIEW='wizard';
  render();
}
function editTicket(ticketId){
  const ticket = STATE.tickets.find(t=>t.id===ticketId);
  if(!ticket) return;
  const cl = STATE.clients.find(c=>c.id===ticket.clientId);
  DRAFT = {
    clientId: ticket.clientId, clientName: cl?cl.name:'', date: ticket.date, time: ticket.time||'',
    stake: String(ticket.stake), odds: ticket.odds!=null ? String(ticket.odds) : '',
    matches: ticket.matches.map(m=>({...m}))
  };
  EDITING_TICKET_ID = ticketId;
  ADMIN_SUBVIEW='wizard';
  render();
}
async function duplicateTicket(ticketId){
  const ticket = STATE.tickets.find(t=>t.id===ticketId);
  if(!ticket) return;
  const newMatches = ticket.matches.map(m=>({...m, id:uid(), result:'pending'}));
  const {data, error} = await supabaseClient.from('tickets').insert({
    client_id: ticket.clientId, date: ticket.date, time: ticket.time, stake: ticket.stake, odds: ticket.odds, matches: newMatches
  }).select().single();
  if(error){ alert('Erro ao duplicar aposta: '+error.message); return; }
  STATE.tickets.push({
    id:data.id, clientId:data.client_id, date:data.date, time: data.time ? data.time.slice(0,5) : null,
    stake:parseFloat(data.stake), odds: data.odds!=null ? parseFloat(data.odds) : null, matches:data.matches||[],
    createdAt: data.created_at, ticketNumber: data.ticket_number
  });
  render();
}
function cancelWizard(){
  if(DRAFT.matches.length && !confirm('Descartar esta aposta em edição?')) return;
  DRAFT=null; EDITING_TICKET_ID=null; ADMIN_SUBVIEW='list'; render();
}
function draftMatchesOddTotal(){
  return DRAFT.matches.filter(m=>m.result!=='void').reduce((p,m)=>p*m.odd,1);
}
function updateWizardTotals(){
  const stake = parseFloat(DRAFT.stake) || 0;
  const odds = parseFloat(DRAFT.odds) || draftMatchesOddTotal();
  const display = document.getElementById('ticket-retorno-display');
  if(display) display.value = (stake>0 && odds>0) ? fmtBRL(stake*odds - stake) : '';
}

async function saveTicket(){
  const clientId = document.getElementById('new-client-id').value;
  const date = document.getElementById('ticket-date').value;
  const time = document.getElementById('ticket-time').value;
  const stake = parseFloat(document.getElementById('ticket-stake').value);
  const oddsRaw = document.getElementById('ticket-odds').value;
  const odds = oddsRaw ? parseFloat(oddsRaw) : null;
  if(!clientId){ alert('Digite e selecione o cliente na lista.'); return; }
  if(!date || !time){ alert('Informe a data e o horário do bilhete.'); return; }
  if(!stake || stake<=0){ alert('Informe o valor da aposta.'); return; }
  if(odds!==null && isNaN(odds)){ alert('Odd inválida.'); return; }
  if(!DRAFT.matches.length){ alert('Adicione ao menos uma partida.'); return; }

  if(EDITING_TICKET_ID){
    const {data, error} = await supabaseClient.from('tickets').update({
      client_id: clientId, date, time, stake, odds, matches: DRAFT.matches
    }).eq('id', EDITING_TICKET_ID).select().single();
    if(error){ alert('Erro ao salvar aposta: '+error.message); return; }
    const idx = STATE.tickets.findIndex(t=>t.id===EDITING_TICKET_ID);
    const updated = {
      id:data.id, clientId:data.client_id, date:data.date, time: data.time ? data.time.slice(0,5) : null,
      stake:parseFloat(data.stake), odds: data.odds!=null ? parseFloat(data.odds) : null, matches:data.matches||[],
      createdAt: data.created_at, ticketNumber: data.ticket_number
    };
    if(idx>=0) STATE.tickets[idx] = updated; else STATE.tickets.push(updated);
  } else {
    const {data, error} = await supabaseClient.from('tickets').insert({
      client_id: clientId, date, time, stake, odds, matches: DRAFT.matches
    }).select().single();
    if(error){ alert('Erro ao salvar aposta: '+error.message); return; }
    STATE.tickets.push({
      id:data.id, clientId:data.client_id, date:data.date, time: data.time ? data.time.slice(0,5) : null,
      stake:parseFloat(data.stake), odds: data.odds!=null ? parseFloat(data.odds) : null, matches:data.matches||[],
      createdAt: data.created_at, ticketNumber: data.ticket_number
    });
  }
  DRAFT=null; EDITING_TICKET_ID=null; ADMIN_SUBVIEW='list';
  render();
}

function toggleEventoFields(){
  const semEvento = document.getElementById('match-sem-evento').checked;
  document.getElementById('evento-fields').style.display = semEvento ? 'none' : 'block';
  document.getElementById('sem-evento-fields').style.display = semEvento ? 'block' : 'none';
}
function quickMarket(market, selection){
  document.getElementById('match-market').value = market;
  document.getElementById('match-selection').value = selection;
  const oddField = document.getElementById('match-odd');
  oddField.focus();
  oddField.select();
}

function addDraftMatch(){
  const semEvento = document.getElementById('match-sem-evento').checked;
  const market = document.getElementById('match-market').value;
  const selection = document.getElementById('match-selection').value.trim();
  const odd = parseFloat(document.getElementById('match-odd').value);
  if(!selection){ alert('Informe a seleção (ex: Casa, Over 2.5, Sim).'); return; }
  if(!odd && odd!==0 || isNaN(odd)){ alert('Informe a odd da seleção.'); return; }

  let home, away, date, time;
  if(semEvento){
    const desc = document.getElementById('match-manual-desc').value.trim();
    if(!desc){ alert('Informe a descrição da aposta de longo prazo.'); return; }
    home = desc; away = '';
  } else {
    home = document.getElementById('match-home').value.trim();
    away = document.getElementById('match-away').value.trim();
    if(!home || !away){ alert('Informe os dois times.'); return; }
  }
  date = DRAFT.date || todaySP();
  time = DRAFT.time || null;
  DRAFT.matches.push({id:uid(), home, away, date, time, market, selection, odd, result:'pending'});
  render();
}
function removeDraftMatch(matchId){
  DRAFT.matches = DRAFT.matches.filter(m=>m.id!==matchId);
  render();
}
function editDraftMatch(matchId){
  const idx = DRAFT.matches.findIndex(m=>m.id===matchId);
  if(idx<0) return;
  const m = DRAFT.matches[idx];
  DRAFT.matches.splice(idx,1);
  render();
  const semEvento = !m.away;
  document.getElementById('match-sem-evento').checked = semEvento;
  toggleEventoFields();
  if(semEvento){
    document.getElementById('match-manual-desc').value = m.home;
  } else {
    document.getElementById('match-home').value = m.home;
    document.getElementById('match-away').value = m.away;
  }
  document.getElementById('match-market').value = m.market;
  document.getElementById('match-selection').value = m.selection;
  document.getElementById('match-odd').value = m.odd;

}

  return weeks.map(wk=>{
    const tickets = STATE.tickets.filter(t=>t.clientId===cl.id && mondayOf(ticketDate(t))===wk);
    const greenCount = tickets.filter(t=>ticketResult(t)==='green').length;
    const redCount = tickets.filter(t=>ticketResult(t)==='red').length;
    const pendingCount = tickets.filter(t=>ticketResult(t)==='pending').length;
    const volume = tickets.reduce((s,t)=>s+t.stake,0);
    const resultado = tickets.reduce((s,t)=>s+ticketProfit(t),0);
    const descontoPct = getWeekDiscount(cl, wk);

    const liquido = applyDescontoSign(cl, resultado, desconto);

      const cm = STATE.commissioners.find(x=>x.id===c.commissionerId);

    }).join(' ') || '<span style="color:var(--text-muted);font-size:12px">Nenhum</span>';

    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">

            ${greenCount?` · <span class="profit-pos">✓ ${greenCount}</span>`:''}

            <div style="display:flex;align-items:center;gap:5px;margin-top:3px">

              <button class="btn-ghost btn-sm" style="padding:1px 6px;font-size:10px" onclick="editWeekDiscount('${cl.id}','${wk}',${descontoPct})" title="Editar desconto só dessa semana">✎</button>

async function editWeekDiscount(clientId, weekStart, currentPct){
  const input = prompt('Desconto (%) só pra essa semana — não muda o padrão nem outras semanas:', currentPct);
  if(input===null) return;
  const pct = parseFloat(String(input).replace(',','.'));
  if(isNaN(pct) || pct<0){ alert('Valor inválido.'); return; }
  const existing = STATE.clientWeekDiscounts.find(o=>o.clientId===clientId && o.weekStart===weekStart);
  if(existing){
    const {error} = await supabaseClient.from('client_week_discount').update({discount_percent: pct}).eq('id', existing.id);
    if(error){ alert('Erro ao salvar: '+error.message); return; }
    existing.discountPercent = pct;
  } else {
    const {data, error} = await supabaseClient.from('client_week_discount').insert({client_id: clientId, week_start: weekStart, discount_percent: pct}).select().single();
    if(error){ alert('Erro ao salvar: '+error.message); return; }
    STATE.clientWeekDiscounts.push({id:data.id, clientId:data.client_id, weekStart:data.week_start, discountPercent:parseFloat(data.discount_percent)||0});
  }
  render();
}

function addToWeekCommEdit(){
  const sel = document.getElementById('week-comm-add-select');

function cancelWeekCommEdit(){
  WEEK_COMM_EDIT = null;
  const overlay = document.getElementById('week-comm-overlay');
  if(overlay) document.body.removeChild(overlay);
}
async function saveWeekCommEdit(){
  const {clientId, weekStart, list} = WEEK_COMM_EDIT;
  const {error: delError} = await supabaseClient.from('client_week_commissioners').delete().eq('client_id', clientId).eq('week_start', weekStart);
  if(delError){ alert('Erro ao salvar: '+delError.message); return; }
  STATE.clientWeekCommissioners = STATE.clientWeekCommissioners.filter(o=>!(o.clientId===clientId && o.weekStart===weekStart));
  if(list.length===0){
    const {data, error} = await supabaseClient.from('client_week_commissioners').insert({client_id: clientId, week_start: weekStart, commissioner_id: null, percent: null}).select().single();
    if(error){ alert('Erro ao salvar: '+error.message); return; }
    STATE.clientWeekCommissioners.push({id:data.id, clientId:data.client_id, weekStart:data.week_start, commissionerId:null, percent:null});
  } else {
    for(const item of list){
      const {data, error} = await supabaseClient.from('client_week_commissioners').insert({client_id: clientId, week_start: weekStart, commissioner_id: item.commissionerId, percent: item.percent}).select().single();
      if(error){ alert('Erro ao salvar: '+error.message); return; }
      STATE.clientWeekCommissioners.push({id:data.id, clientId:data.client_id, weekStart:data.week_start, commissionerId:data.commissioner_id, percent:data.percent!=null?parseFloat(data.percent):null});
    }
  }
  cancelWeekCommEdit();
  render();
}
async function saveClientDetail(id){
  const name = document.getElementById('detail-client-name').value.trim();
  const phone = document.getElementById('detail-client-phone').value.trim();
  const discount = Math.max(0, Math.min(100, parseFloat(document.getElementById('detail-client-discount').value)||0));
  const isDescarga = document.getElementById('detail-client-descarga').checked;
  if(!name){ alert('Informe o nome do cliente.'); return; }
  const {error} = await supabaseClient.from('clients').update({name, phone, discount, is_descarga: isDescarga}).eq('id', id);
  if(error){ alert('Erro ao salvar cliente: '+error.message); return; }
  const cl = STATE.clients.find(c=>c.id===id);
  const discountChanged = cl && cl.discount !== discount;
  if(cl){ cl.name=name; cl.phone=phone; cl.discount=discount; cl.isDescarga=isDescarga; }
  if(discountChanged){
    const effectiveFromWeek = mondayOf(todaySP());
    const {data, error: histError} = await supabaseClient.from('client_discount_history').insert({client_id: id, discount_percent: discount, effective_from_week: effectiveFromWeek}).select().single();
    if(histError){ alert('Cliente salvo, mas houve erro ao registrar a mudança de desconto na linha do tempo: '+histError.message); }
    else{
      STATE.clientDiscountHistory.push({id:data.id, clientId:data.client_id, discountPercent:parseFloat(data.discount_percent)||0, effectiveFromWeek:data.effective_from_week||null});
    }
  }
  CLIENT_DETAIL_ID = null;
  render();
}
async function addClient(){
  const name = document.getElementById('new-client-name').value.trim();
  const phone = document.getElementById('new-client-phone').value.trim();
  const discount = parseFloat(document.getElementById('new-client-discount').value) || 0;
  const isDescarga = document.getElementById('new-client-descarga').checked;
  if(!name) return;
  const code = uid()+uid();
  const {data, error} = await supabaseClient.from('clients').insert({name, code, discount, phone, is_descarga: isDescarga}).select().single();
  if(error){ alert('Erro ao salvar cliente: '+error.message); return; }
  STATE.clients.push({id:data.id, name:data.name, code:data.code, discount:data.discount||0, phone:data.phone||'', isDescarga:data.is_descarga||false});
  const {data: histData, error: histError} = await supabaseClient.from('client_discount_history').insert({client_id: data.id, discount_percent: discount, effective_from_week: null}).select().single();
  if(!histError && histData){
    STATE.clientDiscountHistory.push({id:histData.id, clientId:histData.client_id, discountPercent:parseFloat(histData.discount_percent)||0, effectiveFromWeek:histData.effective_from_week||null});
  }
  render();
}
async function setClientDiscount(id, value){
  const discount = Math.max(0, Math.min(100, parseFloat(value)||0));
  const {error} = await supabaseClient.from('clients').update({discount}).eq('id', id);
  if(error){ alert('Erro ao salvar desconto: '+error.message); return; }

async function deleteClient(id){
  const {error} = await supabaseClient.from('clients').delete().eq('id', id);
  if(error){ alert('Erro ao remover cliente: '+error.message); return; }
  STATE.clients = STATE.clients.filter(c=>c.id!==id);

}

  if(!cl) return;

  document.getElementById('new-client-id').value = id;
  document.getElementById('new-client-search').value = cl.name;

// ---------- PARCEIROS (COMISSIONADOS) ----------

// Desconto efetivo de um cliente numa semana: sobrescrita manual daquela semana,
// senão o desconto padrão atual do cliente.
function getWeekDiscount(client, weekStart){
  // 1) Sobrescrita manual daquela semana específica (feita na aba Semanas) sempre vence.
  const ov = STATE.clientWeekDiscounts.find(o=>o.clientId===client.id && o.weekStart===weekStart);
  if(ov) return ov.discountPercent;
  // 2) Senão, usa a linha do tempo do desconto padrão: pega o valor que estava em vigor
  // naquela semana (não o valor atual), pra mudanças não afetarem semanas passadas.
  const history = STATE.clientDiscountHistory.filter(h=>h.clientId===client.id && (!h.effectiveFromWeek || h.effectiveFromWeek<=weekStart));
  if(history.length===0) return client.discount||0;
  history.sort((a,b)=>(a.effectiveFromWeek||'0000-00-00').localeCompare(b.effectiveFromWeek||'0000-00-00'));
  return history[history.length-1].discountPercent;
}
// Calcula o valor do desconto em cima de um resultado. Pra cliente normal, o desconto
// incide quando ele PERDE (resultado negativo). Pra conta de Descarga é o contrário:
// como você é o "cliente" dentro do sistema do parceiro, o desconto incide quando o
// saldo da descarga fica POSITIVO (que é quando você deve pra ele).
function computeDescontoAmount(client, resultado, weekStart){
  const pct = getWeekDiscount(client, weekStart);
  if(pct<=0) return 0;
  if(client.isDescarga){
    return resultado>0 ? resultado*pct/100 : 0;
  }
  return resultado<0 ? Math.abs(resultado)*pct/100 : 0;
}
// Junta resultado + desconto no sentido certo. Cliente normal: o desconto é um benefício
// PARA ELE, então soma (amortece a perda dele). Conta de Descarga: o desconto é um
// benefício PRA VOCÊ (não pro parceiro), então subtrai do saldo dele.
function applyDescontoSign(client, resultado, desconto){
  return client.isDescarga ? (resultado - desconto) : (resultado + desconto);
}

// Comissionados ativos de um cliente numa semana: se existir QUALQUER sobrescrita
// manual pra essa semana, ela substitui por completo a lista (uma linha com
// commissionerId nulo representa "sem comissionado nessa semana"). Sem sobrescrita,
// usa a linha do tempo dos vínculos (só entram os que já estavam em vigor naquela semana).
function getActiveCommissionersForWeek(clientId, weekStart){
  const overrides = STATE.clientWeekCommissioners.filter(o=>o.clientId===clientId && o.weekStart===weekStart);
  if(overrides.length>0){
    return overrides.filter(o=>o.commissionerId).map(o=>({commissionerId:o.commissionerId, percent:o.percent||0}));
  }
  const applicable = STATE.commissionerClients.filter(l=>l.clientId===clientId && (!l.effectiveFromWeek || l.effectiveFromWeek<=weekStart));
  const byCommissioner = {};
  applicable.forEach(l=>{
    const existing = byCommissioner[l.commissionerId];
    if(!existing || (l.effectiveFromWeek||'0000-00-00') > (existing.effectiveFromWeek||'0000-00-00')){
      byCommissioner[l.commissionerId] = l;
    }
  });
  return Object.values(byCommissioner).map(l=>({commissionerId:l.commissionerId, percent:l.percent}));
}
function grossLossForWeek(clientId, weekStart){
  const tickets = STATE.tickets.filter(t=>t.clientId===clientId && mondayOf(ticketDate(t))===weekStart && ticketResult(t)!=='pending' && ticketResult(t)!=='void');
  const resultado = tickets.reduce((s,t)=>s+ticketProfit(t),0);
  return resultado<0 ? Math.abs(resultado) : 0;
}
function computeCommissionAmount(clientId, percent, weekStart){
  return grossLossForWeek(clientId, weekStart) * (percent/100);
}

async function addCommissioner(){

function countBadges(tickets){
  let green=0, red=0, pending=0, voidCount=0;
  tickets.forEach(t=>{
    const r = ticketResult(t);
    if(r==='green') green++;
    else if(r==='red') red++;
    else if(r==='pending') pending++;
    else if(r==='void') voidCount++;
  });
  let html='';
  if(green) html += `<span class="chip chip-green" style="margin-right:4px">✓ ${green}</span>`;
  if(red) html += `<span class="chip chip-red" style="margin-right:4px">✗ ${red}</span>`;
  if(pending) html += `<span class="chip chip-pending" style="margin-right:4px">⏱ ${pending}</span>`;
  if(voidCount) html += `<span class="chip chip-void" style="margin-right:4px">⊘ ${voidCount}</span>`;
  return html || '—';
}

function getSettlementsFor(clientId, weekStart){

function getAllSettlementsForClient(clientId){
  return STATE.settlements.filter(s=>s.clientId===clientId).reduce((s,x)=>s+x.amount,0);
}
// Saldo contínuo (perspectiva admin, positivo = cliente deve) de todas as apostas já
// resolvidas + saldo em aberto, descontando tudo que já foi pago em qualquer semana.
// excludeWeek (opcional) tira uma semana específica do cálculo das apostas — usado no
// fechamento pra separar "saldo da semana" do "saldo anterior".
function computeContinuousBalance(clientId, excludeWeek){
  const cl = STATE.clients.find(c=>c.id===clientId);
  const resolvedTickets = STATE.tickets.filter(t=>t.clientId===clientId && ticketResult(t)!=='pending' && ticketResult(t)!=='void' && (!excludeWeek || mondayOf(ticketDate(t))!==excludeWeek));
  const weekGroups = {};
  resolvedTickets.forEach(t=>{
    const wk = mondayOf(ticketDate(t));
    (weekGroups[wk] = weekGroups[wk]||[]).push(t);
  });
  let totalBetAdmin = 0;
  Object.entries(weekGroups).forEach(([wk, list])=>{
    const descontoPct = cl ? getWeekDiscount(cl, wk) : 0;
    const resultadoW = list.reduce((s,t)=>s+ticketProfit(t),0);
    const descontoW = cl ? computeDescontoAmount(cl, resultadoW, wk) : 0;
    totalBetAdmin += -(cl ? applyDescontoSign(cl, resultadoW, descontoW) : resultadoW);
  });
  const emAbertoAmount = STATE.transactions.filter(t=>t.type==='em_aberto' && t.clientId===clientId).reduce((s,x)=>s+x.amount,0);
  const totalOwed = totalBetAdmin + emAbertoAmount;
  const totalPaid = getAllSettlementsForClient(clientId);
  return totalOwed - totalPaid;
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawStadiumFallback(ctx, w, h){
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#0B2049'); grad.addColorStop(0.55,'#071633'); grad.addColorStop(1,'#040A1C');
  ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
  [[50,30],[w-50,30]].forEach(([cx,cy])=>{
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,260);
    g.addColorStop(0,'rgba(62,193,243,0.22)');
    g.addColorStop(1,'rgba(62,193,243,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,260,0,Math.PI*2); ctx.fill();
  });
  ctx.save();
  ctx.globalAlpha = 0.09;
  ctx.strokeStyle = '#9FC3E8';
  for(let i=0;i<6;i++){
    ctx.beginPath();
    ctx.ellipse(w/2, -220-i*12, w*0.72+i*26, 150+i*16, 0, 0, Math.PI);
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 2;
  const pitchY = h-60;
  ctx.beginPath(); ctx.moveTo(0,pitchY); ctx.lineTo(w,pitchY); ctx.stroke();
  ctx.beginPath(); ctx.arc(w/2,pitchY,44,Math.PI,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(w/2,pitchY-44); ctx.lineTo(w/2,h); ctx.stroke();
  ctx.restore();
}
function drawBackground(ctx, w, h){
  return new Promise((resolve)=>{
    const saved = localStorage.getItem(BG_STORAGE_KEY);
    if(!saved){ drawStadiumFallback(ctx,w,h); resolve(); return; }
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.max(w/img.width, h/img.height);
      const dw = img.width*scale, dh = img.height*scale;
      ctx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
      ctx.fillStyle = 'rgba(4,10,28,0.55)';
      ctx.fillRect(0,0,w,h);
      resolve();
    };
    img.onerror = ()=>{ drawStadiumFallback(ctx,w,h); resolve(); };
    img.src = saved;
  });
}
function drawTextLogo(ctx){
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.font = '700 40px Montserrat, Arial, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('BET', 40, 66);
  const w = ctx.measureText('BET').width;
  ctx.fillStyle = '#3EC1F3';
  ctx.fillText('WIN', 40+w, 66);
}
function drawLogo(ctx){
  return new Promise((resolve)=>{
    const saved = localStorage.getItem(LOGO_STORAGE_KEY);
    if(!saved){ drawTextLogo(ctx); resolve(); return; }
    const shape = localStorage.getItem(LOGO_SHAPE_KEY) || 'round';
    const img = new Image();
    img.onload = ()=>{
      const size = 100, x = 40, y = 18;
      const srcSize = Math.min(img.width, img.height);
      const sx = (img.width-srcSize)/2, sy = (img.height-srcSize)/2;
      if(shape==='round'){
        ctx.save();
        ctx.beginPath();
        ctx.arc(x+size/2, y+size/2, size/2, 0, Math.PI*2);
        ctx.clip();
        ctx.drawImage(img, sx, sy, srcSize, srcSize, x, y, size, size);
        ctx.restore();
      } else {
        roundRect(ctx, x, y, size, size, 10);
        ctx.save(); ctx.clip();
        ctx.drawImage(img, sx, sy, srcSize, srcSize, x, y, size, size);
        ctx.restore();
      }
      resolve();
    };
    img.onerror = ()=>{ drawTextLogo(ctx); resolve(); };
    img.src = saved;
  });
}
async function gerarFechamento(clientId){
  try{
  const cl = STATE.clients.find(c=>c.id===clientId);
  if(!cl){ alert('Cliente não encontrado.'); return; }
  const todaySPStr = todaySP();
  const weekMonday = DASH_WEEK || mondayOf(todaySPStr);
  const tickets = STATE.tickets.filter(t=>t.clientId===clientId && mondayOf(ticketDate(t))===weekMonday && ticketResult(t)!=='void');

  // Valor Jogado: total de todas as apostas da semana
  const valorJogado = tickets.reduce((s,t)=>s+t.stake,0);
  // Acertos: valor apostado + lucro das apostas Green (retorno total)
  const acertos = tickets.filter(t=>ticketResult(t)==='green').reduce((s,t)=>s+t.stake*effectiveOdds(t),0);
  // Subtotal: somente o lucro ou prejuízo da semana
  const subtotal = acertos - valorJogado;
  // Desconto: só existe se o cliente tem desconto cadastrado, e incide só sobre o saldo da semana
  const descontoPct = getWeekDiscount(cl, weekMonday);
  const desconto = computeDescontoAmount(cl, subtotal, weekMonday);
  const temDesconto = desconto>0;

  // Saldo anterior: saldo contínuo (todas as semanas anteriores + saldo em aberto,
  // já líquido de tudo que foi pago) — exatamente o mesmo cálculo usado no Financeiro.
  const openTransactions = STATE.transactions.filter(t=>t.type==='em_aberto' && t.clientId===clientId);
  const temSaldoAnterior = Math.abs(computeContinuousBalance(clientId, weekMonday)) >= 0.01;
  const saldoAnterior = -computeContinuousBalance(clientId, weekMonday);
  const saldoSemana = applyDescontoSign(cl, subtotal, desconto);
  const saldoTotal = saldoSemana + saldoAnterior;

  // Monta a lista de linhas a desenhar
  const linhas = [];
  linhas.push(['VALOR JOGADO:', 'R$ - '+fmtBRL(valorJogado).replace('R$','').trim(), '#E0575A', false]);
  linhas.push(['ACERTOS:', 'R$ + '+fmtBRL(acertos).replace('R$','').trim(), '#3FB68B', false]);
  linhas.push(['SUBTOTAL:', (subtotal>=0?'R$ + ':'R$ - ')+fmtBRL(Math.abs(subtotal)).replace('R$','').trim(), subtotal>=0?'#3FB68B':'#E0575A', false]);
  if(temDesconto){
    linhas.push(['DESCONTO:', 'R$ + '+fmtBRL(desconto).replace('R$','').trim(), '#3EC1F3', false]);
  }
  if(temSaldoAnterior){
    linhas.push(['SALDO DA SEMANA:', (saldoSemana>=0?'R$ + ':'R$ - ')+fmtBRL(Math.abs(saldoSemana)).replace('R$','').trim(), saldoSemana>=0?'#3FB68B':'#E0575A', false]);
    linhas.push(['SALDO ANTERIOR:', (saldoAnterior>=0?'R$ + ':'R$ - ')+fmtBRL(Math.abs(saldoAnterior)).replace('R$','').trim(), saldoAnterior>=0?'#3FB68B':'#E0575A', false]);
  }
  linhas.push(['SALDO TOTAL:', (saldoTotal>=0?'R$ + ':'R$ - ')+fmtBRL(Math.abs(saldoTotal)).replace('R$','').trim(), saldoTotal>=0?'#3FB68B':'#E0575A', true]);

  const marginX = 55;
  const headerH = 178;
  const FIXED_W = 720, FIXED_H = 700;
  let rowH = 44, rowGap = 9;
  const availableForRows = FIXED_H - headerH - 30;
  const naturalRowsHeight = linhas.length*(rowH+rowGap) + 20;
  if(naturalRowsHeight > availableForRows){
    const scale = availableForRows / naturalRowsHeight;
    rowH *= scale; rowGap *= scale;
  }
  const canvas = document.createElement('canvas');
  canvas.width = FIXED_W; canvas.height = FIXED_H;
  const ctx = canvas.getContext('2d');

  await drawBackground(ctx, canvas.width, canvas.height);
  await drawLogo(ctx);

  // ---- bloco "PERÍODO" (ícone ao lado do rótulo, data embaixo) ----
  ctx.textBaseline = 'alphabetic';
  const rightEdge = canvas.width-40;
  ctx.font = '600 10.5px Montserrat, Arial, sans-serif';
  const labelW = ctx.measureText('PERÍODO').width;
  const monday = new Date(weekMonday+'T00:00:00');
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const fmtLong = d => d.toLocaleDateString('pt-BR');
  const periodoStr = fmtLong(monday)+' a '+fmtLong(sunday);

  const iconSize = 13, iconGap = 6;
  const iconX = rightEdge - labelW - iconGap - iconSize;
  const iconY = 12;

  ctx.save();
  ctx.strokeStyle = '#8FB3DC'; ctx.fillStyle = '#8FB3DC'; ctx.lineWidth = 1.3;
  roundRect(ctx, iconX, iconY, iconSize, iconSize, 2.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(iconX,iconY+5); ctx.lineTo(iconX+iconSize,iconY+5); ctx.stroke();
  ctx.fillRect(iconX+2.5,iconY-2,1.6,5); ctx.fillRect(iconX+iconSize-4.1,iconY-2,1.6,5);
  ctx.restore();

  ctx.textAlign='right';
  ctx.font = '600 10.5px Montserrat, Arial, sans-serif';
  ctx.fillStyle = '#8FB3DC';
  ctx.fillText('PERÍODO', rightEdge, 25);
  ctx.font = '700 13px Inter, Arial, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(periodoStr, rightEdge, 42);

  // ---- título ----
  ctx.font = '700 24px Montserrat, Arial, sans-serif';
  const titleA = 'FECHAMENTO: '; const titleB = cl.name.toUpperCase();
  const wA = ctx.measureText(titleA).width; const wB = ctx.measureText(titleB).width;
  const startX = canvas.width/2 - (wA+wB)/2;
  ctx.textAlign='left';
  ctx.fillStyle = '#FFFFFF'; ctx.fillText(titleA, startX, 142);
  ctx.fillStyle = '#3EC1F3'; ctx.fillText(titleB, startX+wA, 142);

  let rowY = headerH;
  const rowW = canvas.width - marginX*2;

  linhas.forEach(([label, value, color, big], idx)=>{
    if(big) rowY += 10;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    roundRect(ctx, marginX, rowY, rowW, rowH, 9); ctx.fill();
    ctx.textAlign='left';
    ctx.font = `italic 700 ${big?17:14.5}px Montserrat, Arial, sans-serif`;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(label, marginX+20, rowY+rowH/2+5);
    ctx.textAlign='right';
    ctx.font = (big?'700 19px ':'700 16px ')+"'JetBrains Mono', monospace";
    ctx.fillStyle = color;
    ctx.fillText(value, marginX+rowW-20, rowY+rowH/2+5);
    rowY += rowH+rowGap;
  });

  const dataUrl = canvas.toDataURL('image/png');
  showFechamentoPreview(dataUrl, cl.name, weekMonday);
  }catch(err){
    alert('Erro ao gerar a imagem de fechamento: '+err.message);
  }
}

function caixaTotalCalc(){
  const entradasClientes = STATE.settlements.reduce((s,x)=>s+x.amount,0);
  const retiradas = STATE.withdrawals.reduce((s,x)=>s+x.amount,0);
  const receitas = STATE.transactions.filter(t=>t.type==='receita').reduce((s,x)=>s+x.amount,0);
  const despesas = STATE.transactions.filter(t=>t.type==='despesa').reduce((s,x)=>s+x.amount,0);
  return entradasClientes - retiradas + receitas - despesas;
}
function renderFinanceiroTab(){
  const weeks = allWeeksSorted();
  const caixaTotal = caixaTotalCalc();

  if(!FINANCE_WEEK) FINANCE_WEEK = weeks[0] || mondayOf(todaySP());

  // Situação por cliente: saldo CONTÍNUO (todas as semanas), some da lista só quando quitado
  const rows = STATE.clients.map(cl=>{
    const remaining = computeContinuousBalance(cl.id, null);
    if(Math.abs(remaining) < 0.01) return null;
    const totalPaid = getAllSettlementsForClient(cl.id);
    const status = totalPaid>0 ? 'parcial' : 'pendente';
    const openTransactions = STATE.transactions.filter(t=>t.type==='em_aberto' && t.clientId===cl.id);
    const emAbertoAmount = openTransactions.reduce((s,x)=>s+x.amount,0);
    return {id:cl.id, name:cl.name, remaining, totalPaid, status, emAbertoAmount};
  }).filter(Boolean);

  // Resumo: "A receber" é contínuo (soma de tudo que está pendente, de qualquer semana),
  // já que clientes às vezes atrasam. "A pagar" é só da semana selecionada, pois pagamentos
  // pra quem ganha são sempre feitos em dia.
  const receberContinuo = rows.filter(r=>r.remaining>0).reduce((s,r)=>s+r.remaining,0);

  const weekTicketsByClient = {};
  STATE.tickets.filter(t=>mondayOf(ticketDate(t))===FINANCE_WEEK && ticketResult(t)!=='pending' && ticketResult(t)!=='void').forEach(t=>{
    (weekTicketsByClient[t.clientId] = weekTicketsByClient[t.clientId]||[]).push(t);
  });
  let pagarSemana = 0;
  Object.entries(weekTicketsByClient).forEach(([clientId, tks])=>{
    const cl = STATE.clients.find(c=>c.id===clientId);
    const resultadoW = tks.reduce((s,t)=>s+ticketProfit(t),0);
    const descontoW = cl ? computeDescontoAmount(cl, resultadoW, FINANCE_WEEK) : 0;
    const adminAmount = -(cl ? applyDescontoSign(cl, resultadoW, descontoW) : resultadoW);
    if(adminAmount<0) pagarSemana += Math.abs(adminAmount);

async function darBaixa(clientId, weekStart, remaining){
  const isReceber = remaining>=0;
  const label = isReceber ? 'Valor recebido agora' : 'Valor pago agora';
  const defaultVal = Math.abs(remaining).toFixed(2).replace('.',',');
  const input = prompt(`${label} (falta ${fmtBRL(Math.abs(remaining))}):`, defaultVal);
  if(input===null) return;
  const val = parseFloat(String(input).replace(',','.'));
  if(isNaN(val) || val<=0){ alert('Valor inválido.'); return; }
  const amount = isReceber ? val : -val;
  const {data, error} = await supabaseClient.from('settlements').insert({client_id: clientId, week_start: weekStart, amount}).select().single();
  if(error){ alert('Erro ao dar baixa: '+error.message); return; }
  STATE.settlements.push({id:data.id, clientId:data.client_id, weekStart:data.week_start, amount:parseFloat(data.amount), paidAt:data.paid_at});
  render();
}
async function desfazerUltimaBaixa(clientId){
  const list = STATE.settlements.filter(s=>s.clientId===clientId).sort((a,b)=>a.paidAt.localeCompare(b.paidAt));
  const last = list[list.length-1];
  if(!last) return;
  if(!confirm('Desfazer a última baixa registrada para esse cliente?')) return;
  const {error} = await supabaseClient.from('settlements').delete().eq('id', last.id);
  if(error){ alert('Erro ao desfazer baixa: '+error.message); return; }
  STATE.settlements = STATE.settlements.filter(s=>s.id!==last.id);
  render();
}

function renderComissoesSection(){
  const weekMonday = FINANCE_WEEK || mondayOf(todaySP());
  const totals = {}; // commissionerId -> {amount, count}
  STATE.clients.forEach(cl=>{
    const active = getActiveCommissionersForWeek(cl.id, weekMonday);
    active.forEach(a=>{
      const amount = computeCommissionAmount(cl.id, a.percent, weekMonday);
      if(amount<=0) return;
      if(!totals[a.commissionerId]) totals[a.commissionerId] = {amount:0, count:0};
      totals[a.commissionerId].amount += amount;
      totals[a.commissionerId].count += 1;
    });
  });
  const rows = Object.entries(totals).map(([commissionerId, v])=>{
    const cm = STATE.commissioners.find(c=>c.id===commissionerId);

function filterTransactionClientOptions(){
  const input = document.getElementById('new-transaction-client-search');
  const box = document.getElementById('transaction-client-options');
  const val = input.value.trim().toLowerCase();
  document.getElementById('new-transaction-client-id').value = '';
  if(val.length < 2){ box.style.display='none'; box.innerHTML=''; return; }
  const matches = STATE.clients.filter(c=>c.name.toLowerCase().includes(val));
  if(matches.length===0){
    box.innerHTML = '<div class="autocomplete-item" style="cursor:default;color:var(--text-muted)">Nenhum cliente encontrado</div>';
  } else {
    box.innerHTML = matches.map(c=>`<div class="autocomplete-item" onmousedown="selectTransactionClientOption('${c.id}')">${c.name}</div>`).join('');
  }
  box.style.display='block';
}
function selectTransactionClientOption(id){
  const cl = STATE.clients.find(c=>c.id===id);
  if(!cl) return;
  document.getElementById('new-transaction-client-id').value = id;
  document.getElementById('new-transaction-client-search').value = cl.name;
  const box = document.getElementById('transaction-client-options');

}
async function marcarComoRecebido(id){
  const {error} = await supabaseClient.from('transactions').update({type:'receita'}).eq('id', id);
  if(error){ alert('Erro ao atualizar: '+error.message); return; }
  const t = STATE.transactions.find(x=>x.id===id);
  if(t) t.type = 'receita';
  render();
}
async function addTransaction(){
  const type = document.getElementById('new-transaction-type').value;
  const category = document.getElementById('new-transaction-category').value.trim();
  const clientId = document.getElementById('new-transaction-client-id').value || null;
  const description = document.getElementById('new-transaction-desc').value.trim();
  const amount = parseFloat(document.getElementById('new-transaction-amount').value);
  const date = document.getElementById('new-transaction-date').value;
  if(!date){ alert('Informe a data.'); return; }
  if(!amount || amount<=0){ alert('Informe o valor.'); return; }
  const {data, error} = await supabaseClient.from('transactions').insert({type, category, description, amount, date, client_id: clientId}).select().single();
  if(error){ alert('Erro ao registrar lançamento: '+error.message); return; }
  STATE.transactions.push({id:data.id, type:data.type, category:data.category||'', description:data.description||'', amount:parseFloat(data.amount), date:data.date, createdAt:data.created_at, clientId:data.client_id||null});
  await pruneTransactions();
  render();
}
async function pruneTransactions(){
  const LIMIT = 100;
  if(STATE.transactions.length <= LIMIT) return;
  const sorted = [...STATE.transactions].sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
  const toRemove = sorted.slice(0, STATE.transactions.length - LIMIT);
  for(const t of toRemove){
    await supabaseClient.from('transactions').delete().eq('id', t.id);
  }
  const removeIds = new Set(toRemove.map(t=>t.id));
  STATE.transactions = STATE.transactions.filter(t=>!removeIds.has(t.id));
}
async function deleteTransaction(id){
  if(!confirm('Excluir esse lançamento?')) return;
  const {error} = await supabaseClient.from('transactions').delete().eq('id', id);
  if(error){ alert('Erro ao excluir lançamento: '+error.message); return; }
  STATE.transactions = STATE.transactions.filter(t=>t.id!==id);
  render();
}

function shiftWeek(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function changeClientWeek(dir){
  CLIENT_WEEK = shiftWeek(CLIENT_WEEK, dir*7);
  render();
}

function renderClientView(code){
  const app = document.getElementById('app');
  const client = STATE.clients.find(c=>c.code===code);
  if(!client){
    app.innerHTML = `<div class="client-theme client-page-wrap" style="--gold:#3EC1F3; background:#070B14;"><div class="empty">Link inválido ou cliente não encontrado.</div></div>`;
    return;
  }
  const myTickets = STATE.tickets.filter(t=>t.clientId===client.id);

  if(CLIENT_WEEK===null){
    const todaySPStr = todaySP();
    const currentWeekMonday = mondayOf(todaySPStr);
    const hasPendingThisWeek = myTickets.some(t=>mondayOf(ticketDate(t))===currentWeekMonday && ticketResult(t)==='pending');
    if(hasPendingThisWeek){
      CLIENT_WEEK = currentWeekMonday;
    } else {
      const weeksWithData = Array.from(new Set(myTickets.map(t=>mondayOf(ticketDate(t))))).sort();
      CLIENT_WEEK = weeksWithData.length ? weeksWithData[weeksWithData.length-1] : currentWeekMonday;
    }
  }

  const weekTickets = myTickets.filter(t=>mondayOf(ticketDate(t))===CLIENT_WEEK).sort((a,b)=>ticketDate(b).localeCompare(ticketDate(a)));
  const resultado = weekTickets.reduce((s,t)=>s+ticketProfit(t),0);
  const descontoPct = getWeekDiscount(client, CLIENT_WEEK);
  const desconto = computeDescontoAmount(client, resultado, CLIENT_WEEK);
  const liquido = applyDescontoSign(client, resultado, desconto);
  const pendentes = weekTickets.filter(t=>ticketResult(t)==='pending');
  const pendentesValor = pendentes.reduce((s,t)=>s+t.stake,0);

  function ticketMatchesBlock(t){
    return t.matches.map(m=>{
      const marketLabel = MARKETS.find(x=>x.v===m.market)?.l || m.market;
      const teamsLabel = m.away ? `${m.home} x ${m.away}` : m.home;
      return `
        <div style="display:flex;align-items:baseline;gap:5px">
          <span style="flex-shrink:0;font-size:9.5px;line-height:1.5">${resultIconSmall(m.result)}</span>
          <span style="min-width:0;overflow-wrap:break-word;font-size:12.5px;line-height:1.4">
            <strong style="font-weight:600">${teamsLabel}</strong>
            <span style="color:var(--text-muted)"> — ${marketLabel}: ${m.selection}</span>
          </span>
        </div>
      `;
    }).join('');
  }
  // Sombreado discreto por resultado — pendente não recebe nenhuma cor, fica neutro.
  function ticketRowStyle(r){
    if(r==='green') return {bg:'rgba(63,182,139,0.06)', border:'var(--green)'};
    if(r==='red') return {bg:'rgba(224,87,90,0.05)', border:'var(--red)'};
    if(r==='void') return {bg:'rgba(255,255,255,0.02)', border:'var(--line)'};
    return {bg:'var(--surface-2)', border:'var(--line)'};
  }
  const dayGroups = {};
  weekTickets.forEach(t=>{
    if(!dayGroups[t.date]) dayGroups[t.date] = [];
    dayGroups[t.date].push(t);
  });
  const dayKeys = Object.keys(dayGroups).sort((a,b)=>b.localeCompare(a));
  dayKeys.forEach(k=> dayGroups[k].sort((a,b)=>(b.time||'').localeCompare(a.time||'')));

  const ticketRows = dayKeys.map(day=>{
    const rows = dayGroups[day].map(t=>{
      const r = ticketResult(t);
      const profit = ticketProfit(t);
      const style = ticketRowStyle(r);
      return `
        <div style="background:${style.bg};border-left:3px solid ${style.border};border-radius:6px;padding:8px 10px;margin-bottom:6px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px">
            <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);white-space:nowrap">${t.time||'—'} <span style="opacity:0.65">#${t.ticketNumber||'—'}</span></span>
            <span style="font-family:var(--font-mono);font-size:13.5px;font-weight:700;white-space:nowrap" class="${r==='pending'?'':(profit>=0?'profit-pos':'profit-neg')}">${r==='pending'?'—':fmtBRL(profit)}</span>
          </div>
          <div>${ticketMatchesBlock(t)}</div>
          <div style="font-size:10.5px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono)">Valor ${fmtBRL(t.stake)}${ticketOddTotal(t)>0?' · Odds @'+effectiveOdds(t).toFixed(2):''}</div>
        </div>
      `;
    }).join('');
    return `<div style="margin-bottom:14px"><p style="margin:0 0 6px;font-size:13px;font-weight:500;color:var(--text-muted)">${fmtDate(day)}</p>${rows}</div>`;
  }).join('');

  document.title = 'Relatório';
  app.innerHTML = `
    <div class="client-theme client-page-wrap" style="--gold:#3EC1F3; --gold-dim:#1B5E86; --bg:#070B14; --surface:#10141F; --surface-2:#151B29; --line:#222B3E; --text:#F5F7FA; --text-muted:#B8BEC7; background:var(--bg);">
    <div class="client-header"><div class="name" style="color:var(--text)">${client.name}</div></div>

    <div class="card">
      <div style="display:flex;justify-content:center;align-items:center;gap:16px">
        <button class="btn-ghost" style="padding:8px 14px;font-size:14px" onclick="changeClientWeek(-1)">‹</button>
        <span style="font-family:'Montserrat',sans-serif;font-size:14px;font-weight:600;letter-spacing:0.2px">${weekLabel(CLIENT_WEEK)}</span>
        <button class="btn-ghost" style="padding:8px 14px;font-size:14px" onclick="changeClientWeek(1)">›</button>
      </div>
    </div>

    <div class="card" style="display:flex;padding:0">
      <div style="flex:1;text-align:center;padding:0.9rem 0.5rem">
        <div style="font-family:'Montserrat',sans-serif;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;font-weight:600;letter-spacing:0.4px">Resultado</div>
        <div style="font-family:var(--font-mono);font-size:18px;font-weight:700;margin-top:5px" class="${resultado>=0?'profit-pos':'profit-neg'}">${fmtBRL(resultado)}</div>
      </div>
      ${resultado<0 ? `
      <div style="width:1px;background:var(--line)"></div>
      <div style="flex:1;text-align:center;padding:0.9rem 0.5rem">
        <div style="font-family:'Montserrat',sans-serif;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;font-weight:600;letter-spacing:0.4px">Desconto</div>
        <div style="font-family:var(--font-mono);font-size:18px;font-weight:700;margin-top:5px">${fmtBRL(desconto)}</div>
      </div>
      <div style="width:1px;background:var(--line)"></div>
      <div style="flex:1;text-align:center;padding:0.9rem 0.5rem">
        <div style="font-family:'Montserrat',sans-serif;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;font-weight:600;letter-spacing:0.4px">Resultado Final</div>
        <div style="font-family:var(--font-mono);font-size:18px;font-weight:700;margin-top:5px" class="${liquido>=0?'profit-pos':'profit-neg'}">${fmtBRL(liquido)}</div>
      </div>
      ` : ''}
    </div>

    ${pendentes.length>0 ? `
    <div class="card" style="cursor:pointer" onclick="CLIENT_SHOW_PENDENTES=!CLIENT_SHOW_PENDENTES;render()">
      <div style="display:flex;justify-content:center;align-items:center;gap:10px;position:relative">
        <span class="chip chip-pending">PENDENTES (${pendentes.length})</span>
        <span style="font-family:var(--font-mono);font-size:13px;color:var(--gold);font-weight:600">${fmtBRL(pendentesValor)}</span>
        <span style="color:var(--text-muted);font-size:13px;transition:transform 0.15s;display:inline-block;transform:rotate(${CLIENT_SHOW_PENDENTES?90:0}deg)">›</span>
      </div>
      ${CLIENT_SHOW_PENDENTES ? `
        <div style="margin-top:12px;border-top:1px solid var(--line)">
          ${pendentes.map(t=>`
            <div class="match-row">
              <div class="match-desc">
                <span class="meta">${fmtDate(t.date)}${t.time?' '+t.time:''} · ${ticketDetailsShort(t)}</span>
              </div>
              <span style="font-family:var(--font-mono);font-size:12.5px">${fmtBRL(t.stake)}</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
    ` : ''}

    <div class="card">
      <h3 style="text-align:center;font-size:16px">Apostas da semana</h3>
      ${ticketRows || '<div class="empty">Nenhuma aposta nessa semana.</div>'}
    </div>
    </div>
  `;
}

// ---------- COMMISSIONER VIEW ----------
function changeCommissionerWeek(dir){
  COMMISSIONER_WEEK = shiftWeek(COMMISSIONER_WEEK, dir*7);
  render();
}
function renderCommissionerView(code){
  const app = document.getElementById('app');
  const cm = STATE.commissioners.find(c=>c.code===code);
  if(!cm){
    app.innerHTML = `<div class="client-theme client-page-wrap" style="--gold:#3EC1F3; background:#070B14;"><div class="empty">Link inválido ou comissionado não encontrado.</div></div>`;
    return;
  }
  if(COMMISSIONER_WEEK===null){
    COMMISSIONER_WEEK = mondayOf(todaySP());
  }

  const rows = STATE.clients.map(cl=>{
    const active = getActiveCommissionersForWeek(cl.id, COMMISSIONER_WEEK).find(a=>a.commissionerId===cm.id);
    if(!active) return null;
    const tickets = STATE.tickets.filter(t=>t.clientId===cl.id && mondayOf(ticketDate(t))===COMMISSIONER_WEEK && ticketResult(t)!=='pending' && ticketResult(t)!=='void');
    if(tickets.length===0) return null;
    const volume = tickets.reduce((s,t)=>s+t.stake,0);
    const resultado = tickets.reduce((s,t)=>s+ticketProfit(t),0);
    const comissao = computeCommissionAmount(cl.id, active.percent, COMMISSIONER_WEEK);
    return {name: cl.name, volume, resultado, percent: active.percent, comissao};
  }).filter(Boolean);

  const totalComissao = rows.reduce((s,r)=>s+r.comissao,0);

  document.title = 'Relatório';
  app.innerHTML = `
    <div class="client-theme client-page-wrap" style="--gold:#3EC1F3; --gold-dim:#1B5E86; --bg:#070B14; --surface:#10141F; --surface-2:#151B29; --line:#222B3E; --text:#F5F7FA; --text-muted:#B8BEC7; background:var(--bg);">
    <div class="client-header"><div class="name" style="color:var(--text)">${cm.name}</div></div>

    <div class="card">
      <div style="display:flex;justify-content:center;align-items:center;gap:16px">
        <button class="btn-ghost" style="padding:10px 16px;font-size:16px" onclick="changeCommissionerWeek(-1)">‹</button>
        <span style="font-family:'Montserrat',sans-serif;font-size:clamp(15px,4.5vw,17px);font-weight:700">${weekLabel(COMMISSIONER_WEEK)}</span>
        <button class="btn-ghost" style="padding:10px 16px;font-size:16px" onclick="changeCommissionerWeek(1)">›</button>
      </div>
    </div>

    <div class="card" style="text-align:center;padding:1.1rem 0.5rem">
      <div style="font-family:'Montserrat',sans-serif;font-size:12px;color:var(--text-muted);text-transform:uppercase;font-weight:600">Sua comissão da semana</div>
      <div style="font-family:'Montserrat',sans-serif;font-size:clamp(22px,7vw,28px);font-weight:700;margin-top:3px" class="${totalComissao>=0?'profit-pos':'profit-neg'}">${fmtBRL(totalComissao)}</div>
    </div>

    <div class="card">
      <h3>Seus indicados</h3>
      ${rows.length===0 ? '<div class="empty">Nenhum indicado com apostas nessa semana.</div>' : rows.map(r=>`
        <div class="match-row" style="flex-wrap:nowrap;gap:10px">
          <div class="match-desc" style="flex:1;min-width:0;overflow:hidden">
            <span class="teams" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.name}</span>
            <span class="meta" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Volume ${fmtBRL(r.volume)} · resultado <span class="${r.resultado>=0?'profit-pos':'profit-neg'}">${fmtBRL(r.resultado)}</span> · ${r.percent}% de comissão</span>
          </div>
          <span style="font-family:var(--font-mono);font-size:15px;font-weight:700;flex-shrink:0;color:var(--gold)">${fmtBRL(r.comissao)}</span>
        </div>
      `).join('')}
    </div>
    </div>
  `;
}

window.addEventListener('hashchange', render);
supabaseClient.auth.onAuthStateChange((event, session)=>{ SESSION = session; });
(async ()=>{
  const { data } = await supabaseClient.auth.getSession();
  SESSION = data.session;
  await loadState();
  render();
})();
</script>
