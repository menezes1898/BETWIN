<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Boletim — Consultoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Montserrat:wght@300;400&display=swap');

  :root{
    --bg: #070B14;
    --surface: #10141F;
    --surface-2: #151B29;
    --line: #222B3E;
    --text: #F5F7FA;
    --text-muted: #B8BEC7;
    --gold: #3EC1F3;
    --gold-dim: #1B5E86;
    --green: #3FB68B;
    --green-dim: rgba(63,182,139,0.14);
    --red: #E0575A;
    --red-dim: rgba(224,87,90,0.14);
    --font-display: 'Montserrat', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  #app{max-width:960px;margin:0 auto;padding:24px 18px 60px;}

  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:16px;}
  .brand .mark{font-family:var(--font-display);font-weight:300;font-size:28px;letter-spacing:0.5px;color:var(--gold);}
  .brand .sub{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;}

  .tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab{
    font-family:var(--font-display);font-size:17px;font-weight:300;letter-spacing:0.3px;
    padding:9px 16px;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:16px;}
  .card h3{font-family:var(--font-display);font-size:20px;font-weight:300;margin:0 0 14px;letter-spacing:0.2px;}
  label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;margin-top:12px;text-transform:uppercase;letter-spacing:0.6px;}
  input[type=text],input[type=date],input[type=time],input[type=number],select{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:9px 10px;border-radius:4px;font-family:var(--font-body);font-size:14px;
  }
  input:focus,select:focus{outline:none;border-color:var(--gold-dim);}
  input:disabled{color:var(--gold);opacity:0.9;cursor:not-allowed;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:120px;}

  button{
    font-family:var(--font-body);font-weight:600;font-size:13px;letter-spacing:0.2px;
    border:none;border-radius:4px;padding:9px 16px;cursor:pointer;transition:opacity .15s;
  }
  button:hover{opacity:0.85;}
  .btn-primary{background:var(--gold);color:#052034;}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
  .btn-sm{padding:5px 10px;font-size:11px;}
  .btn-full{width:100%;padding:12px;font-size:14px;}
  .btn-danger-ghost{background:var(--surface-2);color:var(--red);border:1px solid var(--line);}

  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--font-mono);letter-spacing:0.3px;white-space:nowrap;}
  .chip-green{background:var(--green-dim);color:var(--green);}
  .chip-red{background:var(--red-dim);color:var(--red);}
  .chip-pending{background:var(--surface-2);color:var(--text-muted);}
  .chip-void{background:var(--surface-2);color:var(--text-muted);text-decoration:line-through;}

  .ticket{border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px;background:var(--surface);}
  .ticket.ticket-compact{padding:9px 12px;margin-bottom:7px;}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .ticket-compact .ticket-top{gap:6px;}
  .ticket-client{font-size:16px;font-weight:700;color:var(--gold);}
  .ticket-compact .ticket-client{font-size:14.5px;}
  .ticket-meta{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);margin-top:2px;}
  .ticket-compact .ticket-meta{font-size:11px;margin-top:1px;}
  .match-list{margin-top:10px;border-top:1px solid var(--line);}
  .ticket-compact .match-list{margin-top:6px;}
  .match-row{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .ticket-compact .match-row{padding:5px 0;gap:6px;}
  .match-row:last-child{border-bottom:none;}
  .match-desc{font-size:13.5px;}
  .ticket-compact .match-desc{font-size:12px;}
  .match-desc .teams{font-weight:600;}
  .match-desc .meta{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);display:block;margin-top:2px;}
  .ticket-compact .match-desc .meta{font-size:10.5px;margin-top:0;}
  .match-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
  .ticket-compact .match-actions .btn-sm{padding:3px 7px;font-size:10px;}
  .ticket-footer{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:13px;}
  .ticket-compact .ticket-footer{margin-top:6px;padding-top:6px;font-size:12px;}
  .ticket-actions{margin-top:10px;display:flex;gap:6px;}
  .ticket-compact .ticket-actions{margin-top:6px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);}
  th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.5px;font-weight:600;}
  td.num{font-family:var(--font-mono);text-align:right;}
  tr.total td{font-weight:700;border-top:2px solid var(--line);border-bottom:none;}
  .profit-pos{color:var(--green);}
  .profit-neg{color:var(--red);}

  .link-box{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .link-box code{flex:1;background:var(--surface-2);padding:8px 10px;border-radius:4px;font-family:var(--font-mono);font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .empty{color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center;}
  .week-select{background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:4px;font-family:var(--font-mono);font-size:12px;width:auto;}

  .autocomplete-wrap{position:relative;}
  .autocomplete-list{
    position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--surface-2);
    border:1px solid var(--line);border-radius:4px;max-height:190px;overflow-y:auto;z-index:20;display:none;
  }
  .autocomplete-item{padding:9px 10px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line);}
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item:hover{background:var(--surface);color:var(--gold);}

  .draft-card{background:var(--surface-2);border:1px dashed var(--line);}
  .draft-match{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;gap:8px;}
  .draft-match:last-child{border-bottom:none;}
  .odd-total{font-family:var(--font-mono);color:var(--gold);font-size:14px;}

  .client-header{margin-bottom:20px;text-align:center;}
  .client-header .name{font-family:'Montserrat', sans-serif;font-size:clamp(30px,9vw,38px);font-weight:400;letter-spacing:0.2px;color:var(--gold);line-height:1.15;}
  .client-header .balance-now{font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-top:4px;}

  @media (max-width:600px){
    .tab{font-size:15px;padding:8px 10px;}
    th,td{font-size:12px;padding:7px 5px;}
    #app{padding:16px 12px 50px;}
    .card{padding:14px;}
    .card h3{font-size:18px;}
    .row{gap:14px;}
  }
</style>
</head>
<body>
<div id="app"><div class="empty">Carregando…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ======= CONFIGURAÇÃO DO SUPABASE =======
// Pegue esses dois valores em: Supabase > seu projeto > Settings > API
const SUPABASE_URL = 'https://tymcwpyypvzjdzumlfkp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Tf4F0bAvZsHyevsy0JUa0g_q8G4_-dW';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// ==========================================

let STATE = { clients: [], tickets: [], settlements: [], withdrawals: [], transactions: [] };
let ADMIN_TAB = 'dashboard';
let ADMIN_SUBVIEW = 'list'; // 'list' | 'wizard'
let DASH_WEEK = null;
let FINANCE_WEEK = null;
let SHOW_LANCAMENTOS = false;
let SHOW_RETIRADAS = false;
let DRAFT = null;
let EDITING_TICKET_ID = null;
let TEAM_RESULTS = {};
let SEARCH_TIMERS = {};
let SHOW_PENDENTES = false;
let CLIENT_WEEK = null;
let CLIENT_DETAIL_ID = null;
let CONFIRM_DELETE_CLIENT = false;
let CLIENT_SHOW_PENDENTES = false;
let SESSION = null;

const MARKETS = [
  {v:'Resultado Final', l:'Resultado Final (1X2)'},
  {v:'Dupla Chance', l:'Dupla Chance'},
  {v:'Ambas Marcam', l:'Ambas Marcam'},
  {v:'Total de Gols', l:'Total de Gols (Over/Under)'},
  {v:'Handicap Asiatico', l:'Handicap Asiático'},
  {v:'Total de Escanteios', l:'Total de Escanteios'},
  {v:'Total de Cartoes', l:'Total de Cartões'},
  {v:'Resultado Exato', l:'Resultado Exato'},
  {v:'Outro', l:'—'},
];

async function loadState(){
  try{
    const [{data: clients, error: err1}, {data: tickets, error: err2}, {data: settlements, error: err3}, {data: withdrawals, error: err4}, {data: transactions, error: err5}] = await Promise.all([
      supabaseClient.from('clients').select('*').order('created_at'),
      supabaseClient.from('tickets').select('*').order('created_at'),
      supabaseClient.from('settlements').select('*').order('paid_at'),
      supabaseClient.from('withdrawals').select('*').order('created_at'),
      supabaseClient.from('transactions').select('*').order('date')
    ]);
    if(err1 || err2 || err3 || err4 || err5){
      alert('Erro ao conectar no Supabase: '+((err1||err2||err3||err4||err5).message)+'\nVerifique a URL e a ANON KEY no início do arquivo.');
      return;
    }
    STATE.clients = (clients||[]).map(c=>({id:c.id, name:c.name, code:c.code, discount:parseFloat(c.discount)||0, phone:c.phone||''}));
    STATE.tickets = (tickets||[]).map(t=>({
      id:t.id, clientId:t.client_id, date:t.date, time: t.time ? t.time.slice(0,5) : null,
      stake: parseFloat(t.stake), odds: t.odds!=null ? parseFloat(t.odds) : null, matches: t.matches||[],
      createdAt: t.created_at, ticketNumber: t.ticket_number
    }));
    STATE.settlements = (settlements||[]).map(s=>({
      id:s.id, clientId:s.client_id, weekStart:s.week_start, amount:parseFloat(s.amount), paidAt:s.paid_at
    }));
    STATE.withdrawals = (withdrawals||[]).map(w=>({
      id:w.id, amount:parseFloat(w.amount), description:w.description||'', createdAt:w.created_at
    }));
    STATE.transactions = (transactions||[]).map(t=>({
      id:t.id, type:t.type, category:t.category||'', description:t.description||'', amount:parseFloat(t.amount), date:t.date, createdAt:t.created_at, clientId:t.client_id||null
    }));
  }catch(e){
    alert('Erro ao conectar no Supabase: '+e.message);
  }
}

function uid(){ return Math.random().toString(36).slice(2,9); }
function fmtBRL(v){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v); }
function fmtDate(d){ if(!d) return ''; const [y,m,day]=d.split('-'); return `${day}/${m}`; }

function mondayOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = (day===0?-6:1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function weekLabel(mondayStr){
  const d = new Date(mondayStr+'T00:00:00');
  const sun = new Date(d); sun.setDate(d.getDate()+6);
  const f = x=>x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  return `${f(d)} – ${f(sun)}`;
}

// ---------- TICKET (bilhete) HELPERS ----------
function ticketDate(ticket){
  return ticket.date || new Date().toISOString().slice(0,10);
}
function ticketResult(ticket){
  if(!ticket.matches.length) return 'pending';
  if(ticket.matches.some(m=>m.result==='red')) return 'red';
  if(ticket.matches.every(m=>m.result==='void')) return 'void';
  if(ticket.matches.some(m=>m.result==='pending')) return 'pending';
  return 'green';
}
function ticketOddTotal(ticket){
  return ticket.matches.filter(m=>m.result!=='void').reduce((p,m)=>p*m.odd,1);
}
function ticketProfit(ticket){
  const r = ticketResult(ticket);
  if(r==='red') return -ticket.stake;
  if(r==='green') return ticket.odds ? (ticket.stake*ticket.odds) - ticket.stake : 0;
  return 0;
}
function resultChip(r){
  const map = {green:['chip-green','GREEN'], red:['chip-red','RED'], void:['chip-void','ANULADA'], pending:['chip-pending','PENDENTE']};
  const [cls,label] = map[r]||map.pending;
  return `<span class="chip ${cls}">${label}</span>`;
}
function resultIconSmall(r){
  if(r==='green') return '<span style="color:var(--green);font-weight:700">✓</span>';
  if(r==='red') return '<span style="color:var(--red);font-weight:700">✗</span>';
  if(r==='void') return '<span style="color:var(--text-muted);font-weight:700">⊘</span>';
  return '<span style="color:var(--gold);font-weight:700">⏱</span>';
}
function allWeeksSorted(){
  const set = new Set();
  STATE.tickets.forEach(t=>set.add(mondayOf(ticketDate(t))));
  return Array.from(set).sort().reverse();
}

// ---------- ROOT RENDER ----------
function render(){
  const hash = window.location.hash;
  const m = hash.match(/cliente=([a-zA-Z0-9]+)/);
  if(m){ renderClientView(m[1]); return; }
  if(!SESSION){ renderLogin(); return; }
  renderAdmin();
}

// ---------- LOGIN ----------
function renderLogin(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="brand"><span class="mark" style="color:var(--gold)">BET WIN</span><span class="sub">Painel da Consultoria</span></div>
    <div class="card" style="max-width:340px;margin:60px auto 0">
      <h3>Entrar</h3>
      <label>E-mail</label>
      <input type="email" id="login-email" placeholder="seu@email.com" onkeydown="if(event.key==='Enter') document.getElementById('login-password').focus()">
      <label>Senha</label>
      <input type="password" id="login-password" placeholder="Sua senha" onkeydown="if(event.key==='Enter') doLogin()">
      <div id="login-error" style="color:var(--red);font-size:12px;margin-top:8px;display:none"></div>
      <div style="margin-top:14px"><button class="btn-primary btn-full" onclick="doLogin()">Entrar</button></div>
    </div>
  `;
  document.getElementById('login-email').focus();
}
async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display='none';
  if(!email || !password){ errEl.textContent='Preencha e-mail e senha.'; errEl.style.display='block'; return; }
  const {data, error} = await supabaseClient.auth.signInWithPassword({email, password});
  if(error){ errEl.textContent='E-mail ou senha incorretos.'; errEl.style.display='block'; return; }
  SESSION = data.session;
  render();
}
async function doLogout(){
  await supabaseClient.auth.signOut();
  SESSION = null;
  render();
}

// ---------- ADMIN ----------
function renderAdmin(){
  const app = document.getElementById('app');
  const pendentesCount = STATE.tickets.filter(t=>ticketResult(t)==='pending').length;
  app.innerHTML = `
    <div class="brand">
      <div><span class="mark">BET WIN</span></div>
      <button class="btn-ghost btn-sm" onclick="doLogout()">Sair</button>
    </div>
    <div class="tabs">
      <div class="tab ${ADMIN_TAB==='dashboard'?'active':''}" onclick="setTab('dashboard')">Dashboard</div>
      <div class="tab ${ADMIN_TAB==='apostas'?'active':''}" onclick="setTab('apostas')">Apostas</div>
      <div class="tab ${ADMIN_TAB==='pendentes'?'active':''}" onclick="setTab('pendentes')">Pendentes${pendentesCount?' ('+pendentesCount+')':''}</div>
      <div class="tab ${ADMIN_TAB==='clientes'?'active':''}" onclick="setTab('clientes')">Clientes</div>
      <div class="tab ${ADMIN_TAB==='financeiro'?'active':''}" onclick="setTab('financeiro')">Financeiro</div>
    </div>
    <div id="tab-content"></div>
  `;
  const c = document.getElementById('tab-content');
  if(ADMIN_TAB==='apostas') c.innerHTML = renderApostasTab();
  if(ADMIN_TAB==='pendentes') c.innerHTML = renderPendentesTab();
  if(ADMIN_TAB==='clientes') c.innerHTML = renderClientesTab();
  if(ADMIN_TAB==='dashboard') c.innerHTML = renderDashboardTab();
  if(ADMIN_TAB==='financeiro') c.innerHTML = renderFinanceiroTab();
}
function setTab(t){ ADMIN_TAB=t; ADMIN_SUBVIEW='list'; render(); }
function renderPendentesTab(){
  const pendentes = STATE.tickets.filter(t=>ticketResult(t)==='pending').sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const pendentesValor = pendentes.reduce((s,t)=>s+t.stake,0);
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="margin:0">Apostas pendentes</h3>
        <span style="font-family:var(--font-mono);font-size:14px;color:var(--gold)">${fmtBRL(pendentesValor)}</span>
      </div>
    </div>
    <div class="card">
      ${pendentes.length===0 ? '<div class="empty">Nenhuma aposta pendente no momento.</div>' : pendentes.map(renderTicketCard).join('')}
    </div>
  `;
}

// ---------- APOSTAS TAB ----------
function renderApostasTab(){
  if(ADMIN_SUBVIEW==='wizard') return renderWizard();

  const ticketsSorted = [...STATE.tickets].sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  const pendentes = STATE.tickets.filter(t=>ticketResult(t)==='pending');
  const pendentesValor = pendentes.reduce((s,t)=>s+t.stake,0);

  return `
    <button class="btn-primary btn-full" onclick="startNewTicket()">+ Nova Aposta</button>
    <div style="height:16px"></div>
    <div class="card" style="cursor:pointer" onclick="SHOW_PENDENTES=!SHOW_PENDENTES;render()">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="chip chip-pending">PENDENTES (${pendentes.length})</span>
        <span style="font-family:var(--font-mono);font-size:14px;color:var(--gold)">${fmtBRL(pendentesValor)}</span>
      </div>
      ${SHOW_PENDENTES ? (pendentes.length===0 ? '<div class="empty">Nenhuma aposta pendente.</div>' : `
        <div style="margin-top:12px;border-top:1px solid var(--line)">
          ${pendentes.map(t=>{
            const cl = STATE.clients.find(c=>c.id===t.clientId);
            return `
              <div class="match-row">
                <div class="match-desc">
                  <span class="teams">${cl?cl.name:'Cliente removido'}</span>
                  <span class="meta">${fmtDate(t.date)}${t.time?' '+t.time:''} · ${ticketDetailsShort(t)}</span>
                </div>
                <span style="font-family:var(--font-mono);font-size:13px">${fmtBRL(t.stake)}</span>
              </div>
            `;
          }).join('')}
        </div>
      `) : ''}
    </div>
    <div style="height:16px"></div>
    <div class="card">
      <label>Buscar aposta (nº ou nome do cliente)</label>
      <input type="text" id="ticket-search-input" placeholder="Ex: 42 ou nome do cliente" oninput="updateTicketSearch()">
    </div>
    <div class="card">
      <h3>Apostas cadastradas</h3>
      <div id="ticket-list-container">${renderTicketListItems(ticketsSorted)}</div>
    </div>
  `;
}
function renderTicketListItems(list){
  return list.length===0 ? '<div class="empty">Nenhuma aposta encontrada.</div>' : list.map(renderTicketCard).join('');
}
function updateTicketSearch(){
  const val = document.getElementById('ticket-search-input').value.trim().toLowerCase();
  const ticketsSorted = [...STATE.tickets].sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  const filtered = !val ? ticketsSorted : ticketsSorted.filter(t=>{
    const cl = STATE.clients.find(c=>c.id===t.clientId);
    const clientName = cl ? cl.name.toLowerCase() : '';
    const num = String(t.ticketNumber||'');
    return num.includes(val) || clientName.includes(val);
  });
  document.getElementById('ticket-list-container').innerHTML = renderTicketListItems(filtered);
}
function ticketDetailsShort(ticket){
  return ticket.matches.map(m=>{
    const marketLabel = MARKETS.find(x=>x.v===m.market)?.l || m.market;
    const teamsLabel = m.away ? `${m.home} x ${m.away}` : m.home;
    return `${teamsLabel} — ${marketLabel}: ${m.selection}`;
  }).join('; ');
}

function renderTicketCard(ticket){
  const cl = STATE.clients.find(c=>c.id===ticket.clientId);
  const r = ticketResult(ticket);
  const profit = ticketProfit(ticket);
  const matchesHtml = ticket.matches.map(m=>{
    const marketLabel = MARKETS.find(x=>x.v===m.market)?.l || m.market;
    const teamsLabel = m.away ? `${m.home} x ${m.away}` : m.home;
    return `
      <div class="match-row">
        <div class="match-desc">
          <span class="teams">${teamsLabel}</span>
          <span class="meta">${marketLabel}: ${m.selection} · odd ${m.odd.toFixed(2)}</span>
        </div>
        <div class="match-actions">
          ${resultChip(m.result)}
          ${m.result==='pending' ? `
            <button class="btn-ghost btn-sm" onclick="setMatchResult('${ticket.id}','${m.id}','green')">Green</button>
            <button class="btn-ghost btn-sm" onclick="setMatchResult('${ticket.id}','${m.id}','red')">Red</button>
            <button class="btn-ghost btn-sm" onclick="setMatchResult('${ticket.id}','${m.id}','void')">Anular</button>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="ticket ticket-compact">
      <div class="ticket-top">
        <div>
          <div class="ticket-client"><span style="font-family:var(--font-mono);font-weight:400;font-size:11px;color:var(--text-muted)">#${ticket.ticketNumber||'—'}</span> ${cl?cl.name:'Cliente removido'}</div>
          <div class="ticket-meta">${fmtDate(ticket.date)}${ticket.time?' '+ticket.time:''} · stake ${fmtBRL(ticket.stake)} · odd ${ticket.odds!=null?ticket.odds.toFixed(2):'—'}</div>
        </div>
        ${resultChip(r)}
      </div>
      <div class="match-list">${matchesHtml}</div>
      <div class="ticket-footer">
        <span>Resultado</span>
        <span class="${profit>=0?'profit-pos':'profit-neg'}">${r==='pending'?'—':(profit>=0?'+':'')+fmtBRL(profit)}</span>
      </div>
      <div class="ticket-actions">
        <button class="btn-ghost btn-sm" onclick="editTicket('${ticket.id}')">Editar</button>
        <button class="btn-ghost btn-sm" onclick="duplicateTicket('${ticket.id}')">Duplicar</button>
        <button class="btn-danger-ghost btn-sm" onclick="deleteTicket('${ticket.id}')">Excluir</button>
      </div>
    </div>
  `;
}

async function setMatchResult(ticketId, matchId, result){
  const ticket = STATE.tickets.find(t=>t.id===ticketId);
  const match = ticket.matches.find(m=>m.id===matchId);
  if(!match || match.result!=='pending'){ alert('Esse resultado já foi definido. Para alterar, use Editar aposta.'); render(); return; }
  match.result = result;
  const {error} = await supabaseClient.from('tickets').update({matches: ticket.matches}).eq('id', ticketId);
  if(error){ alert('Erro ao salvar resultado: '+error.message); match.result='pending'; return; }
  render();
}
function setDraftMatchResult(matchId, result){
  const m = DRAFT.matches.find(x=>x.id===matchId);
  if(m){ m.result = result; render(); }
}
async function deleteTicket(ticketId){
  if(!confirm('Excluir esta aposta?')) return;
  const {error} = await supabaseClient.from('tickets').delete().eq('id', ticketId);
  if(error){ alert('Erro ao excluir aposta: '+error.message); return; }
  STATE.tickets = STATE.tickets.filter(t=>t.id!==ticketId);
  render();
}

// ---------- WIZARD (Nova Aposta) ----------
function startNewTicket(){
  DRAFT = {clientId:'', clientName:'', date:new Date().toISOString().slice(0,10), time:'', stake:'', matches:[]};
  EDITING_TICKET_ID = null;
  ADMIN_SUBVIEW='wizard';
  render();
}
function editTicket(ticketId){
  const ticket = STATE.tickets.find(t=>t.id===ticketId);
  if(!ticket) return;
  const cl = STATE.clients.find(c=>c.id===ticket.clientId);
  DRAFT = {
    clientId: ticket.clientId, clientName: cl?cl.name:'', date: ticket.date, time: ticket.time||'',
    stake: String(ticket.stake), odds: ticket.odds!=null ? String(ticket.odds) : '',
    matches: ticket.matches.map(m=>({...m}))
  };
  EDITING_TICKET_ID = ticketId;
  ADMIN_SUBVIEW='wizard';
  render();
}
function duplicateTicket(ticketId){
  const ticket = STATE.tickets.find(t=>t.id===ticketId);
  if(!ticket) return;
  const cl = STATE.clients.find(c=>c.id===ticket.clientId);
  DRAFT = {
    clientId: ticket.clientId, clientName: cl?cl.name:'', date: new Date().toISOString().slice(0,10), time: ticket.time||'',
    stake: String(ticket.stake), odds: ticket.odds!=null ? String(ticket.odds) : '',
    matches: ticket.matches.map(m=>({...m, id:uid(), result:'pending'}))
  };
  EDITING_TICKET_ID = null;
  ADMIN_SUBVIEW='wizard';
  render();
}
function cancelWizard(){
  if(DRAFT.matches.length && !confirm('Descartar esta aposta em edição?')) return;
  DRAFT=null; EDITING_TICKET_ID=null; ADMIN_SUBVIEW='list'; render();
}
function updateWizardTotals(){
  const stake = parseFloat(DRAFT.stake) || 0;
  const odds = parseFloat(DRAFT.odds) || 0;
  const display = document.getElementById('ticket-retorno-display');
  if(display) display.value = (stake>0 && odds>0) ? fmtBRL(stake*odds - stake) : '';
}

async function saveTicket(){
  const clientId = document.getElementById('new-client-id').value;
  const date = document.getElementById('ticket-date').value;
  const time = document.getElementById('ticket-time').value;
  const stake = parseFloat(document.getElementById('ticket-stake').value);
  const oddsRaw = document.getElementById('ticket-odds').value;
  const odds = oddsRaw ? parseFloat(oddsRaw) : null;
  if(!clientId){ alert('Digite e selecione o cliente na lista.'); return; }
  if(!date || !time){ alert('Informe a data e o horário do bilhete.'); return; }
  if(!stake || stake<=0){ alert('Informe o valor da aposta.'); return; }
  if(odds!==null && odds<=1){ alert('A odd total, se informada, precisa ser maior que 1.'); return; }
  if(!DRAFT.matches.length){ alert('Adicione ao menos uma partida.'); return; }

  if(EDITING_TICKET_ID){
    const {data, error} = await supabaseClient.from('tickets').update({
      client_id: clientId, date, time, stake, odds, matches: DRAFT.matches
    }).eq('id', EDITING_TICKET_ID).select().single();
    if(error){ alert('Erro ao salvar aposta: '+error.message); return; }
    const idx = STATE.tickets.findIndex(t=>t.id===EDITING_TICKET_ID);
    const updated = {
      id:data.id, clientId:data.client_id, date:data.date, time: data.time ? data.time.slice(0,5) : null,
      stake:parseFloat(data.stake), odds: data.odds!=null ? parseFloat(data.odds) : null, matches:data.matches||[],
      createdAt: data.created_at, ticketNumber: data.ticket_number
    };
    if(idx>=0) STATE.tickets[idx] = updated; else STATE.tickets.push(updated);
  } else {
    const {data, error} = await supabaseClient.from('tickets').insert({
      client_id: clientId, date, time, stake, odds, matches: DRAFT.matches
    }).select().single();
    if(error){ alert('Erro ao salvar aposta: '+error.message); return; }
    STATE.tickets.push({
      id:data.id, clientId:data.client_id, date:data.date, time: data.time ? data.time.slice(0,5) : null,
      stake:parseFloat(data.stake), odds: data.odds!=null ? parseFloat(data.odds) : null, matches:data.matches||[],
      createdAt: data.created_at, ticketNumber: data.ticket_number
    });
  }
  DRAFT=null; EDITING_TICKET_ID=null; ADMIN_SUBVIEW='list';
  render();
}

        <div><label>Retorno (lucro)</label><input type="text" id="ticket-retorno-display" value="${(parseFloat(DRAFT.stake)>0 && parseFloat(DRAFT.odds)>0) ? fmtBRL(parseFloat(DRAFT.stake)*parseFloat(DRAFT.odds)-parseFloat(DRAFT.stake)) : ''}" placeholder="Calculado automaticamente" disabled></div>

function toggleEventoFields(){
  const semEvento = document.getElementById('match-sem-evento').checked;
  document.getElementById('evento-fields').style.display = semEvento ? 'none' : 'block';
  document.getElementById('sem-evento-fields').style.display = semEvento ? 'block' : 'none';
}
function quickMarket(market, selection){
  document.getElementById('match-market').value = market;
  document.getElementById('match-selection').value = selection;
}

function addDraftMatch(){
  const semEvento = document.getElementById('match-sem-evento').checked;
  const market = document.getElementById('match-market').value;
  const selection = document.getElementById('match-selection').value.trim();
  const odd = parseFloat(document.getElementById('match-odd').value);
  if(!selection){ alert('Informe a seleção (ex: Casa, Over 2.5, Sim).'); return; }
  if(!odd || odd<=1){ alert('Informe a odd da seleção (maior que 1).'); return; }

  let home, away, date, time;
  if(semEvento){
    const desc = document.getElementById('match-manual-desc').value.trim();
    if(!desc){ alert('Informe a descrição da aposta de longo prazo.'); return; }
    home = desc; away = '';
  } else {
    home = document.getElementById('match-home').value.trim();
    away = document.getElementById('match-away').value.trim();
    if(!home || !away){ alert('Informe os dois times.'); return; }
  }
  date = DRAFT.date || new Date().toISOString().slice(0,10);
  time = DRAFT.time || null;
  DRAFT.matches.push({id:uid(), home, away, date, time, market, selection, odd, result:'pending'});
  render();
}
function removeDraftMatch(matchId){
  DRAFT.matches = DRAFT.matches.filter(m=>m.id!==matchId);
  render();
}

  if(CLIENT_DETAIL_ID) return renderClientDetail(CLIENT_DETAIL_ID);
  return `
    <div class="card">
      <h3>Novo cliente</h3>
      <label>Nome do cliente</label>
      <input type="text" id="new-client-name" placeholder="Ex: João Silva">

      <input type="text" id="new-client-phone" placeholder="Ex: (11) 91234-5678">
      <label>Desconto em caso de perda (%)</label>

function renderClientListItems(list){

    <div class="card" style="cursor:pointer" onclick="openClientDetail('${cl.id}')">

        <div>
          <div style="font-weight:600;font-size:15px">${cl.name}</div>

        </div>
        <span style="color:var(--text-muted);font-size:18px">›</span>
      </div>
    </div>

function updateClientSearch(){

function openClientDetail(id){

}

async function saveClientDetail(id){
  const name = document.getElementById('detail-client-name').value.trim();
  const phone = document.getElementById('detail-client-phone').value.trim();
  const discount = Math.max(0, Math.min(100, parseFloat(document.getElementById('detail-client-discount').value)||0));
  if(!name){ alert('Informe o nome do cliente.'); return; }
  const {error} = await supabaseClient.from('clients').update({name, phone, discount}).eq('id', id);
  if(error){ alert('Erro ao salvar cliente: '+error.message); return; }
  const cl = STATE.clients.find(c=>c.id===id);
  if(cl){ cl.name=name; cl.phone=phone; cl.discount=discount; }
  CLIENT_DETAIL_ID = null;
  render();
}
async function addClient(){
  const name = document.getElementById('new-client-name').value.trim();
  const phone = document.getElementById('new-client-phone').value.trim();
  const discount = parseFloat(document.getElementById('new-client-discount').value) || 0;
  if(!name) return;
  const code = uid()+uid();
  const {data, error} = await supabaseClient.from('clients').insert({name, code, discount, phone}).select().single();
  if(error){ alert('Erro ao salvar cliente: '+error.message); return; }
  STATE.clients.push({id:data.id, name:data.name, code:data.code, discount:data.discount||0, phone:data.phone||''});
  render();
}
async function setClientDiscount(id, value){
  const discount = Math.max(0, Math.min(100, parseFloat(value)||0));
  const {error} = await supabaseClient.from('clients').update({discount}).eq('id', id);
  if(error){ alert('Erro ao salvar desconto: '+error.message); return; }
  const cl = STATE.clients.find(c=>c.id===id);
  if(cl) cl.discount = discount;
}
async function deleteClient(id){
  const {error} = await supabaseClient.from('clients').delete().eq('id', id);
  if(error){ alert('Erro ao remover cliente: '+error.message); return; }
  STATE.clients = STATE.clients.filter(c=>c.id!==id);
  CLIENT_DETAIL_ID = null;
  CONFIRM_DELETE_CLIENT = false;
  render();
}
function copyLink(id){
  const text = document.getElementById(`link-${id}`).textContent;
  navigator.clipboard?.writeText(text);
}
function filterClientOptions(){
  const input = document.getElementById('new-client-search');
  const box = document.getElementById('client-options');
  const val = input.value.trim().toLowerCase();
  document.getElementById('new-client-id').value = '';

// ---------- DASHBOARD TAB ----------
function countBadges(tickets){
  let green=0, red=0, pending=0, voidCount=0;
  tickets.forEach(t=>{
    const r = ticketResult(t);
    if(r==='green') green++;
    else if(r==='red') red++;
    else if(r==='pending') pending++;
    else if(r==='void') voidCount++;
  });
  let html='';
  if(green) html += `<span class="chip chip-green" style="margin-right:4px">✓ ${green}</span>`;
  if(red) html += `<span class="chip chip-red" style="margin-right:4px">✗ ${red}</span>`;
  if(pending) html += `<span class="chip chip-pending" style="margin-right:4px">⏱ ${pending}</span>`;
  if(voidCount) html += `<span class="chip chip-void" style="margin-right:4px">⊘ ${voidCount}</span>`;
  return html || '—';
}

// ---------- FINANCEIRO ----------
function getSettlementsFor(clientId, weekStart){
  return STATE.settlements.filter(s=>s.clientId===clientId && s.weekStart===weekStart);
}
function caixaTotalCalc(){
  const entradasClientes = STATE.settlements.reduce((s,x)=>s+x.amount,0);
  const retiradas = STATE.withdrawals.reduce((s,x)=>s+x.amount,0);
  const receitas = STATE.transactions.filter(t=>t.type==='receita').reduce((s,x)=>s+x.amount,0);
  const despesas = STATE.transactions.filter(t=>t.type==='despesa').reduce((s,x)=>s+x.amount,0);
  return entradasClientes - retiradas + receitas - despesas;
}
function renderFinanceiroTab(){
  const weeks = allWeeksSorted();
  const caixaTotal = caixaTotalCalc();

  if(weeks.length===0){
    return `
      <div class="card">
        <h3>Financeiro</h3>
        <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase">Caixa (total acumulado)</div>
        <div style="font-family:var(--font-mono);font-size:22px;margin-top:4px" class="${caixaTotal>=0?'profit-pos':'profit-neg'}">${fmtBRL(caixaTotal)}</div>
      </div>
      <div class="card"><div class="empty">Cadastre apostas para ver o financeiro por semana.</div></div>
      ${renderRetiradasSection()}
      ${renderLancamentosSection()}
    `;
  }
  if(!FINANCE_WEEK || !weeks.includes(FINANCE_WEEK)) FINANCE_WEEK = weeks[0];

  const rows = STATE.clients.map(cl=>{
    const tickets = STATE.tickets.filter(t=>t.clientId===cl.id && mondayOf(ticketDate(t))===FINANCE_WEEK);
    const openTransactions = STATE.transactions.filter(t=>t.type==='em_aberto' && t.clientId===cl.id);
    const emAbertoAmount = openTransactions.reduce((s,x)=>s+x.amount,0);
    if(tickets.length===0 && openTransactions.length===0) return null;
    const resultadoCliente = tickets.reduce((s,t)=>s+ticketProfit(t),0);
    const descontoPct = cl.discount||0;
    const desconto = resultadoCliente<0 ? Math.abs(resultadoCliente)*descontoPct/100 : 0;
    const betAmount = -resultadoCliente - desconto;
    const amount = betAmount + emAbertoAmount;
    const paidList = getSettlementsFor(cl.id, FINANCE_WEEK);
    const totalPaid = paidList.reduce((s,x)=>s+x.amount,0);
    const remaining = amount - totalPaid;
    const status = Math.abs(remaining)<0.01 ? 'pago' : (paidList.length>0 ? 'parcial' : 'pendente');
    return {id:cl.id, name:cl.name, amount, totalPaid, remaining, status, emAbertoAmount, betAmount};
  }).filter(Boolean);

  const pendentesReceber = rows.filter(r=>r.status!=='pago' && r.remaining>0).reduce((s,r)=>s+r.remaining,0);
  const pendentesPagar = rows.filter(r=>r.status!=='pago' && r.remaining<0).reduce((s,r)=>s+Math.abs(r.remaining),0);

  const options = weeks.map(w=>`<option value="${w}" ${w===FINANCE_WEEK?'selected':''}>Semana de ${weekLabel(w)}</option>`).join('');

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <h3 style="margin:0">Financeiro</h3>

      </div>
    </div>
    <div class="card">
      <h3>Situação por cliente</h3>
      ${rows.length===0 ? '<div class="empty">Nenhuma aposta nessa semana.</div>' : rows.map(r=>`

          <div class="match-desc" style="flex:1;min-width:0;overflow:hidden">

            <span class="meta" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
              ${r.remaining>=0?'A receber':'A pagar'}
              ${r.emAbertoAmount ? ` (inclui saldo em aberto de ${fmtBRL(Math.abs(r.emAbertoAmount))})` : ''}
              ${r.status==='parcial' ? ` — já ${r.totalPaid>=0?'recebido':'pago'} ${fmtBRL(Math.abs(r.totalPaid))} de ${fmtBRL(Math.abs(r.amount))}` : ''}
            </span>
          </div>
          <div class="match-actions" style="flex-shrink:0;flex-wrap:nowrap;white-space:nowrap">
            ${r.status==='pago'
              ? `<span class="chip chip-green">PAGO</span><button class="btn-ghost btn-sm" onclick="desfazerUltimaBaixa('${r.id}','${FINANCE_WEEK}')">Desfazer última</button>`
              : `<span title="Saldo da semana de apostas: ${fmtBRL(r.betAmount)}${r.emAbertoAmount ? ' · Saldo anterior (em aberto): '+fmtBRL(r.emAbertoAmount) : ''}" style="font-family:var(--font-mono);font-size:15px;font-weight:700;cursor:help;border-bottom:1px dotted currentColor" class="${r.remaining>=0?'profit-pos':'profit-neg'}">${fmtBRL(Math.abs(r.remaining))}</span>
                 ${r.status==='parcial' ? `<span class="chip chip-pending">PARCIAL</span>` : `<span class="chip chip-pending">PENDENTE</span>`}
                 <button class="btn-ghost btn-sm" onclick="darBaixa('${r.id}','${FINANCE_WEEK}',${r.remaining},${r.amount})">Dar baixa</button>
                 ${r.status==='parcial' ? `<button class="btn-ghost btn-sm" onclick="desfazerUltimaBaixa('${r.id}','${FINANCE_WEEK}')">Desfazer última</button>` : ''}`
            }
          </div>
        </div>
      `).join('')}
    </div>
    ${renderRetiradasSection()}
    ${renderLancamentosSection()}
  `;
}
async function darBaixa(clientId, weekStart, remaining, fullAmount){
  const isReceber = remaining>=0;
  const label = isReceber ? 'Valor recebido agora' : 'Valor pago agora';
  const defaultVal = Math.abs(remaining).toFixed(2).replace('.',',');
  const input = prompt(`${label} (falta ${fmtBRL(Math.abs(remaining))}):`, defaultVal);
  if(input===null) return;
  const val = parseFloat(String(input).replace(',','.'));
  if(isNaN(val) || val<=0){ alert('Valor inválido.'); return; }
  const amount = isReceber ? val : -val;
  const {data, error} = await supabaseClient.from('settlements').insert({client_id: clientId, week_start: weekStart, amount}).select().single();
  if(error){ alert('Erro ao dar baixa: '+error.message); return; }
  STATE.settlements.push({id:data.id, clientId:data.client_id, weekStart:data.week_start, amount:parseFloat(data.amount), paidAt:data.paid_at});
  if(fullAmount!==undefined){
    const totalPaidNow = getSettlementsFor(clientId, weekStart).reduce((s,x)=>s+x.amount,0);
    const novoRestante = fullAmount - totalPaidNow;
    if(Math.abs(novoRestante) < 0.01){
      const openIds = STATE.transactions.filter(t=>t.type==='em_aberto' && t.clientId===clientId).map(t=>t.id);
      for(const id of openIds){
        await supabaseClient.from('transactions').update({type:'receita'}).eq('id', id);
        const t = STATE.transactions.find(x=>x.id===id);
        if(t) t.type = 'receita';
      }
    }
  }
  render();
}
async function desfazerUltimaBaixa(clientId, weekStart){
  const list = getSettlementsFor(clientId, weekStart).sort((a,b)=>a.paidAt.localeCompare(b.paidAt));
  const last = list[list.length-1];
  if(!last) return;
  if(!confirm('Desfazer a última baixa registrada para esse cliente nessa semana?')) return;
  const {error} = await supabaseClient.from('settlements').delete().eq('id', last.id);
  if(error){ alert('Erro ao desfazer baixa: '+error.message); return; }
  STATE.settlements = STATE.settlements.filter(s=>s.id!==last.id);
  render();
}

        const valueSign = t.type==='despesa' ? '-' : '+';
        return `
        <div class="match-row">
          <div class="match-desc">
            <span class="teams">${t.description || typeLabel}${linkedClient?' — '+linkedClient.name:''}${t.type==='em_aberto'?' <span class="chip chip-pending" style="margin-left:4px">EM ABERTO</span>':''}</span>
            <span class="meta">${fmtDate(t.date)}${t.category?' · '+t.category:''} · registrado em ${registradoEm}</span>
          </div>
          <div class="match-actions">
            <span style="font-family:var(--font-mono);font-size:13px" class="${valueColor}" ${t.type==='em_aberto'?'style="color:var(--gold)"':''}>${valueSign}${fmtBRL(t.amount)}</span>
            ${t.type==='em_aberto' ? `<button class="btn-ghost btn-sm" onclick="marcarComoRecebido('${t.id}')">Marcar recebido</button>` : ''}
            <button class="btn-danger-ghost btn-sm" onclick="deleteTransaction('${t.id}')">Excluir</button>
          </div>
        </div>
      `;}).join('')}
    </div>
    ` : ''}
  `;
}
function filterTransactionClientOptions(){
  const input = document.getElementById('new-transaction-client-search');
  const box = document.getElementById('transaction-client-options');
  const val = input.value.trim().toLowerCase();
  document.getElementById('new-transaction-client-id').value = '';
  if(val.length < 2){ box.style.display='none'; box.innerHTML=''; return; }
  const matches = STATE.clients.filter(c=>c.name.toLowerCase().includes(val));
  if(matches.length===0){
    box.innerHTML = '<div class="autocomplete-item" style="cursor:default;color:var(--text-muted)">Nenhum cliente encontrado</div>';
  } else {
    box.innerHTML = matches.map(c=>`<div class="autocomplete-item" onmousedown="selectTransactionClientOption('${c.id}')">${c.name}</div>`).join('');
  }
  box.style.display='block';
}
function selectTransactionClientOption(id){
  const cl = STATE.clients.find(c=>c.id===id);
  if(!cl) return;
  document.getElementById('new-transaction-client-id').value = id;
  document.getElementById('new-transaction-client-search').value = cl.name;
  const box = document.getElementById('transaction-client-options');
  box.style.display='none'; box.innerHTML='';
}
async function marcarComoRecebido(id){
  const {error} = await supabaseClient.from('transactions').update({type:'receita'}).eq('id', id);
  if(error){ alert('Erro ao atualizar: '+error.message); return; }
  const t = STATE.transactions.find(x=>x.id===id);
  if(t) t.type = 'receita';
  render();
}
async function addTransaction(){
  const type = document.getElementById('new-transaction-type').value;
  const category = document.getElementById('new-transaction-category').value.trim();
  const clientId = document.getElementById('new-transaction-client-id').value || null;
  const description = document.getElementById('new-transaction-desc').value.trim();
  const amount = parseFloat(document.getElementById('new-transaction-amount').value);
  const date = document.getElementById('new-transaction-date').value;
  if(!date){ alert('Informe a data.'); return; }
  if(!amount || amount<=0){ alert('Informe o valor.'); return; }
  const {data, error} = await supabaseClient.from('transactions').insert({type, category, description, amount, date, client_id: clientId}).select().single();
  if(error){ alert('Erro ao registrar lançamento: '+error.message); return; }
  STATE.transactions.push({id:data.id, type:data.type, category:data.category||'', description:data.description||'', amount:parseFloat(data.amount), date:data.date, createdAt:data.created_at, clientId:data.client_id||null});
  await pruneTransactions();
  render();
}
async function pruneTransactions(){
  const LIMIT = 100;
  if(STATE.transactions.length <= LIMIT) return;
  const sorted = [...STATE.transactions].sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
  const toRemove = sorted.slice(0, STATE.transactions.length - LIMIT);
  for(const t of toRemove){
    await supabaseClient.from('transactions').delete().eq('id', t.id);
  }
  const removeIds = new Set(toRemove.map(t=>t.id));
  STATE.transactions = STATE.transactions.filter(t=>!removeIds.has(t.id));
}
async function deleteTransaction(id){
  if(!confirm('Excluir esse lançamento?')) return;
  const {error} = await supabaseClient.from('transactions').delete().eq('id', id);
  if(error){ alert('Erro ao excluir lançamento: '+error.message); return; }
  STATE.transactions = STATE.transactions.filter(t=>t.id!==id);
  render();
}

// ---------- CLIENT VIEW ----------
function shiftWeek(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function changeClientWeek(dir){
  CLIENT_WEEK = shiftWeek(CLIENT_WEEK, dir*7);
  render();
}

function renderClientView(code){
  const app = document.getElementById('app');
  const client = STATE.clients.find(c=>c.code===code);
  if(!client){
    app.innerHTML = `<div class="client-theme" style="--gold:#3EC1F3; background:#070B14; margin:-24px -18px -60px; padding:24px 18px 60px; min-height:100vh;"><div class="empty">Link inválido ou cliente não encontrado.</div></div>`;
    return;
  }
  const myTickets = STATE.tickets.filter(t=>t.clientId===client.id);

  if(CLIENT_WEEK===null) CLIENT_WEEK = mondayOf(new Date().toISOString().slice(0,10));

  const weekTickets = myTickets.filter(t=>mondayOf(ticketDate(t))===CLIENT_WEEK).sort((a,b)=>ticketDate(b).localeCompare(ticketDate(a)));
  const resultado = weekTickets.reduce((s,t)=>s+ticketProfit(t),0);
  const descontoPct = client.discount||0;
  const desconto = resultado<0 ? Math.abs(resultado)*descontoPct/100 : 0;
  const liquido = resultado + desconto;
  const pendentes = weekTickets.filter(t=>ticketResult(t)==='pending');
  const pendentesValor = pendentes.reduce((s,t)=>s+t.stake,0);

  function ticketMatchesBlock(t){
    return t.matches.map(m=>{
      const marketLabel = MARKETS.find(x=>x.v===m.market)?.l || m.market;
      const teamsLabel = m.away ? `${m.home} x ${m.away}` : m.home;
      return `
        <p style="margin:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${teamsLabel}</p>
        <p style="margin:1px 0 6px;font-size:10.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${marketLabel}: ${m.selection}</p>
      `;
    }).join('');
  }
  const dayGroups = {};
  weekTickets.forEach(t=>{
    if(!dayGroups[t.date]) dayGroups[t.date] = [];
    dayGroups[t.date].push(t);
  });
  const dayKeys = Object.keys(dayGroups).sort((a,b)=>b.localeCompare(a));
  dayKeys.forEach(k=> dayGroups[k].sort((a,b)=>(a.time||'').localeCompare(b.time||'')));

  const ticketRows = dayKeys.map(day=>{
    const rows = dayGroups[day].map(t=>{
      const r = ticketResult(t);
      const profit = ticketProfit(t);
      return `
        <div style="background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div style="min-width:40px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">${t.time||'—'}</span><br><span style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted);opacity:0.7">#${t.ticketNumber||'—'}</span></div>
          <div style="flex:1;min-width:0">
            ${ticketMatchesBlock(t)}
            <p style="margin:0;font-size:11px;color:var(--text-muted)">Valor: ${fmtBRL(t.stake)}</p>
          </div>
          <div style="text-align:right;white-space:nowrap">
            <p style="margin:0;font-size:12px;font-family:var(--font-mono);color:var(--text-muted)">${t.odds!=null?'@'+t.odds.toFixed(2):'—'}</p>
            <p style="margin:2px 0 0;font-size:14px;font-weight:600" class="${r==='pending'?'':(profit>=0?'profit-pos':'profit-neg')}">${r==='pending'?'—':fmtBRL(profit)}</p>
          </div>
        </div>
      `;
    }).join('');
    return `<div style="margin-bottom:14px"><p style="margin:0 0 6px;font-size:13px;font-weight:500;color:var(--text-muted)">${fmtDate(day)}</p>${rows}</div>`;
  }).join('');

  app.innerHTML = `
    <div class="client-theme" style="--gold:#3EC1F3; --gold-dim:#1B5E86; --bg:#070B14; --surface:#10141F; --surface-2:#151B29; --line:#222B3E; --text:#F5F7FA; --text-muted:#B8BEC7; background:var(--bg); margin:-24px -18px -60px; padding:24px 18px 60px; min-height:100vh;">
    <div class="client-header"><div class="name" style="color:var(--text)">${client.name}</div></div>

    <div class="card">
      <div style="display:flex;justify-content:center;align-items:center;gap:16px">
        <button class="btn-ghost" style="padding:10px 16px;font-size:16px" onclick="changeClientWeek(-1)">‹</button>
        <span style="font-family:var(--font-mono);font-size:clamp(15px,4.5vw,17px);font-weight:600">Semana de ${weekLabel(CLIENT_WEEK)}</span>
        <button class="btn-ghost" style="padding:10px 16px;font-size:16px" onclick="changeClientWeek(1)">›</button>
      </div>
    </div>

    <div class="card" style="display:flex;padding:0">
      <div style="flex:1;text-align:center;padding:0.85rem 0.5rem">
        <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;font-weight:600">Resultado</div>
        <div style="font-family:var(--font-mono);font-size:clamp(20px,6.5vw,26px);font-weight:700;margin-top:3px" class="${resultado>=0?'profit-pos':'profit-neg'}">${fmtBRL(resultado)}</div>
      </div>
      ${resultado<0 ? `
      <div style="width:1px;background:var(--line)"></div>
      <div style="flex:1;text-align:center;padding:0.85rem 0.5rem">
        <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase">Desconto</div>
        <div style="font-family:var(--font-mono);font-size:16px;margin-top:3px">${fmtBRL(desconto)}</div>
      </div>
      <div style="width:1px;background:var(--line)"></div>
      <div style="flex:1;text-align:center;padding:0.85rem 0.5rem">
        <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase">Líquido</div>
        <div style="font-family:var(--font-mono);font-size:16px;margin-top:3px" class="${liquido>=0?'profit-pos':'profit-neg'}">${fmtBRL(liquido)}</div>
      </div>
      ` : ''}
    </div>

    ${pendentes.length>0 ? `
    <div class="card" style="cursor:pointer" onclick="CLIENT_SHOW_PENDENTES=!CLIENT_SHOW_PENDENTES;render()">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="chip chip-pending">PENDENTES (${pendentes.length})</span>
        <span style="font-family:var(--font-mono);font-size:14px;color:var(--gold)">${fmtBRL(pendentesValor)}</span>
      </div>
      ${CLIENT_SHOW_PENDENTES ? `
        <div style="margin-top:12px;border-top:1px solid var(--line)">
          ${pendentes.map(t=>`
            <div class="match-row">
              <div class="match-desc">
                <span class="meta">${fmtDate(t.date)}${t.time?' '+t.time:''} · ${ticketDetailsShort(t)}</span>
              </div>
              <span style="font-family:var(--font-mono);font-size:13px">${fmtBRL(t.stake)}</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
    ` : ''}

    <div class="card">
      <h3>Apostas da semana</h3>
      ${ticketRows || '<div class="empty">Nenhuma aposta nessa semana.</div>'}
    </div>
    </div>
  `;
}

window.addEventListener('hashchange', render);
supabaseClient.auth.onAuthStateChange((event, session)=>{ SESSION = session; });
(async ()=>{
  const { data } = await supabaseClient.auth.getSession();
  SESSION = data.session;
  await loadState();
  render();
})();
</script>
